<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Rigging Studio - Contexto Dinâmico & Interpolação Visual</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #18181f;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #3f3f52;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #575773;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #3f3f52 #18181f;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 220px);
      position: relative;
    }

    #sidebar {
      width: 320px;
      background-color: #2b2b36;
      border-right: 1px solid #3f3f52;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      overflow-y: auto;
    }

    h2 {
      font-size: 1.1rem;
      color: #00d2ff;
      border-bottom: 1px solid #3f3f52;
      padding-bottom: 6px;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      color: #aaa;
    }

    select, input[type="number"] {
      background-color: #18181f;
      color: #fff;
      border: 1px solid #575773;
      padding: 6px;
      border-radius: 4px;
      outline: none;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    button {
      background-color: #3f3f52;
      color: #fff;
      border: 1px solid #575773;
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #575773;
    }

    button.active {
      background-color: #00d2ff;
      color: #121216;
      font-weight: bold;
      border-color: #00d2ff;
    }

    .accent-btn {
      background-color: #0088cc;
      border-color: #00aaff;
    }

    .accent-btn:hover {
      background-color: #00aaff;
    }

    .warning-btn {
      background-color: #d97706;
      border-color: #f59e0b;
      color: #fff;
    }

    .warning-btn:hover {
      background-color: #f59e0b;
    }

    .danger-btn {
      background-color: #8b0000;
      border-color: #a00000;
    }

    .danger-btn:hover {
      background-color: #a00000;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #00d2ff;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #ddd;
      cursor: pointer;
    }

    .info-box {
      background-color: #18181f;
      padding: 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #aaa;
      line-height: 1.4;
    }

    .info-box b {
      color: #00d2ff;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      cursor: crosshair;
      overflow: hidden;
    }

    /* Suavização de renderização visual via CSS */
    canvas {
      image-rendering: auto;
      image-rendering: smooth;
    }

    canvas#stage {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #121216;
    }

    .floating-window {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 240px;
      background-color: #2b2b36;
      border: 1px solid #00d2ff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 40;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .floating-header {
      background-color: #18181f;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #00d2ff;
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3f3f52;
    }

    .floating-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #timeline-bar {
      height: 220px;
      background-color: #18181f;
      border-top: 2px solid #3f3f52;
      display: flex;
      flex-direction: column;
      padding: 10px 20px;
      gap: 8px;
    }

    .timeline-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .timeline-track-wrapper {
      display: flex;
      width: 100%;
      flex: 1;
      position: relative;
      overflow: hidden;
      border: 1px solid #3f3f52;
      border-radius: 4px;
      background-color: #121216;
    }

    #bone-layers-panel {
      width: 180px;
      background: #18181f;
      border-right: 1px solid #3f3f52;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .bone-layer-row {
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      border-bottom: 1px solid #2b2b36;
      font-size: 0.75rem;
    }

    .bone-layer-row.active {
      background-color: #2a2a3a;
    }

    .bone-layer-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      flex: 1;
      padding: 0 4px;
    }

    .layer-btn-group {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .btn-layer-toggle {
      padding: 0 3px;
      font-size: 0.7rem;
      background: transparent;
      border: none;
      cursor: pointer;
      opacity: 0.8;
    }

    .btn-layer-toggle:hover {
      opacity: 1;
      background: transparent;
    }

    .btn-layer-toggle.hidden-item {
      opacity: 0.3;
      filter: grayscale(100%);
    }

    .btn-layer-order {
      padding: 1px 3px;
      font-size: 0.65rem;
      line-height: 1;
      background: #3f3f52;
      border: 1px solid #575773;
      border-radius: 2px;
      cursor: pointer;
    }

    .btn-layer-order:hover {
      background: #00d2ff;
      color: #121216;
    }

    .timeline-canvas-container {
      flex: 1;
      overflow-y: auto;
      position: relative;
    }

    canvas#timeline-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: #2b2b36;
      border: 1px solid #3f3f52;
      border-radius: 8px;
      padding: 20px;
      width: 820px;
      max-width: 95vw;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3f3f52;
      padding-bottom: 10px;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #crop-canvas-container {
      width: 100%;
      height: 400px;
      overflow: hidden;
      background: #121216;
      border: 1px solid #3f3f52;
      position: relative;
    }

    #crop-canvas {
      cursor: crosshair;
      width: 100%;
      height: 100%;
    }

    .modal-toolbar {
      display: flex;
      gap: 10px;
      width: 100%;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="sidebar">
      <h2>2D Rigging Studio</h2>

      <div class="section">
        <label>Ações Rápidas</label>
        <button onclick="undo()">↶ Desfazer (Ctrl+Z)</button>
        <button onclick="resetStageZoom()">🔍 Resetar Zoom / Pan</button>
      </div>

      <div class="section">
        <label>Visualização do Palco</label>
        <label id="lbl-unselected-opacity">Opacidade dos Não Selecionados: 75%</label>
        <input type="range" id="unselected-opacity-slider" min="0" max="1" step="0.05" value="0.75" oninput="updateUnselectedOpacity(this.value)">

        <div style="margin-top: 6px; background: #18181f; padding: 8px; border-radius: 4px;" class="section">
          <label class="checkbox-container">
            <input type="checkbox" id="chk-onion-skin" onchange="toggleOnionSkin(this.checked)">
            👻 Exibir Fantasmas (Onion Skin)
          </label>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
            <label style="font-size: 0.75rem;">Frames Anteriores:</label>
            <input type="number" id="onion-count-input" value="3" min="1" max="10" style="width: 50px;" onchange="updateOnionCount(this.value)">
          </div>
        </div>
      </div>

      <div class="section">
        <label>1. Modo de Interação</label>
        <div class="btn-group">
          <button id="btn-mode-bone-root" class="active" onclick="setMode('ADD_BONE_ROOT')">+ Osso Raiz</button>
          <button id="btn-mode-bone-child" onclick="setMode('ADD_BONE_CHILD')">+ Osso Filho</button>
        </div>
        <div class="btn-group" style="margin-top: 4px;">
          <button id="btn-mode-draw" onclick="setMode('DRAW_MESH')">Desenhar</button>
          <button id="btn-mode-pose" onclick="setMode('POSE')">Posicionar</button>
        </div>
      </div>

      <div class="section">
        <label>2. Importar Imagens</label>
        <button class="accent-btn" onclick="openImageModal()">📥 Importar / Recortar Nova Imagem</button>

        <div id="unattached-images-box" class="section" style="margin-top: 6px; background: #18181f; padding: 8px; border-radius: 4px;">
          <label style="color:#00d2ff; font-weight: bold;">Imagens Soltas (Não Associadas):</label>
          <select id="unattached-select" onchange="render()"></select>
          <button class="accent-btn" onclick="attachUnattachedImageToSelectedBone()" style="margin-top: 4px;">🔗 Associar ao Osso Selecionado</button>
        </div>
      </div>

      <div class="section" id="pose-controls" style="display: none;">
        <label style="color:#00d2ff; font-weight: bold;">Transformação / Ajustes</label>

        <label>Alvo da Operação:</label>
        <div class="btn-group">
          <button id="btn-target-bone" class="active" onclick="setTransformTarget('BONE')">Osso</button>
          <button id="btn-target-image" onclick="setTransformTarget('IMAGE')">Imagem</button>
        </div>

        <div id="bone-transform-box" class="section">
          <label id="lbl-bone-name">Rotacionar Osso (°)</label>
          <input type="range" id="angle-slider" min="-180" max="180" value="0">

          <label>Comprimento (Escala Osso):</label>
          <input type="range" id="bone-len-slider" min="10" max="500" value="100">

          <label>Translação X:</label>
          <input type="range" id="bone-posx-slider" min="-1000" max="1000" value="0">

          <label>Translação Y:</label>
          <input type="range" id="bone-posy-slider" min="-1000" max="1000" value="0">
        </div>

        <div id="image-transform-box" class="section" style="display: none;">
          <div id="attached-image-info" style="font-size:0.8rem; color:#ffcc00; font-weight:bold; margin-bottom: 4px;">
            Nenhuma imagem associada
          </div>

          <div id="sprite-editor-controls" class="section">
            <button class="warning-btn" onclick="detachSelectedSprite()">🔓 Desassociar e Mover para Soltas</button>

            <label>Rotação Própria (°):</label>
            <input type="range" id="sprite-rot" min="-180" max="180" value="0">

            <label>Offset X:</label>
            <input type="range" id="sprite-offx" min="-1000" max="1000" value="0">

            <label>Offset Y:</label>
            <input type="range" id="sprite-offy" min="-1000" max="1000" value="0">

            <label>Escala Imagem:</label>
            <input type="range" id="sprite-scale" min="0.05" max="5" step="0.05" value="1">

            <button class="danger-btn" onclick="removeSelectedSprite()">Excluir Imagem Definitivamente</button>
          </div>
        </div>
      </div>

      <div class="section">
        <label>Identificação & Estrutura</label>
        <div class="info-box" id="hierarchy-info">
          Nenhum osso selecionado.
        </div>
      </div>

      <div class="section">
        <button class="danger-btn" onclick="clearAll()">Limpar Tudo</button>
      </div>
    </div>

    <div id="canvas-container">
      <canvas id="stage"></canvas>

      <div class="floating-window" id="floating-menu">
        <div class="floating-header" id="floating-menu-header">
          <span>📁 Opções de Importação & Arquivo</span>
          <span style="font-size: 0.7rem; color: #888;">⠿ Drag</span>
        </div>
        <div class="floating-body">
          <button class="accent-btn" onclick="loadFromLocalStorage()">📂 Carregar Salvo (Local)</button>
          <button onclick="exportJSON()">💾 Exportar JSON</button>
          <button onclick="document.getElementById('file-input-json').click()">📥 Importar JSON</button>
          <input type="file" id="file-input-json" accept=".json" style="display: none;" onchange="importJSON(event)">
          <button class="accent-btn" onclick="saveToLocalStorage()" title="Salvar Projeto (Local)">💾 Salvar Projeto (Local)</button>
        </div>
      </div>
    </div>
  </div>

  <div id="timeline-bar">
    <div class="timeline-controls">
      <button id="btn-play" class="accent-btn" onclick="togglePlay()">▶ Play</button>
      <button onclick="jumpToKeyframe(-1)">&lt; KF</button>
      <button onclick="jumpToKeyframe(1)">KF &gt;</button>
      <button id="btn-toggle-interp" onclick="toggleKeyframeInterpolation()" title="Ativar/Desativar interpolação entre esta keyframe e a próxima">⚡ Interpolação</button>
      <button class="accent-btn" onclick="addKeyframe()">+ Gravar KF (Osso Ativo)</button>
      <button class="danger-btn" onclick="removeKeyframe()">- Remover KF</button>

      <div style="display:flex; align-items:center; gap:5px; margin-left:10px;">
        <label style="color:#00d2ff; font-weight:bold;">Frames:</label>
        <input type="number" id="max-frames-input" value="60" min="5" max="1000" style="width: 55px;" onchange="updateMaxFrames(this.value)">
      </div>

      <div style="display:flex; align-items:center; gap:5px; margin-left:5px;">
        <label style="color:#00d2ff; font-weight:bold;">FPS:</label>
        <input type="number" id="fps-input" value="24" min="1" max="120" style="width: 50px;" onchange="updateFPS(this.value)">
      </div>

      <span id="frame-counter" style="font-weight: bold; color: #00d2ff; margin-left:10px;">Frame: 0 / 60</span>
      <span id="keyframe-info" style="font-size:0.8rem; color:#ffcc00; font-weight:bold; margin-left:auto;"></span>
    </div>

    <div class="timeline-track-wrapper">
      <div id="bone-layers-panel"></div>
      <div class="timeline-canvas-container">
        <canvas id="timeline-canvas"></canvas>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="image-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Importar & Recortar Imagem Solta</h3>
        <button onclick="closeImageModal()">X</button>
      </div>
      <div class="modal-body">
        <div class="modal-toolbar">
          <input type="file" id="image-loader" accept="image/*">
          <div>
            <button onclick="resetCropZoom()">Resetar Zoom</button>
            <button onclick="undoCropPoint()">Desfazer Ponto</button>
            <button class="accent-btn" onclick="finishPolygon()">Fechar Polígono</button>
          </div>
        </div>

        <div id="crop-canvas-container">
          <canvas id="crop-canvas"></canvas>
        </div>

        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
          <label class="checkbox-container">
            <input type="checkbox" id="chk-remove-white" checked>
            Remover Fundo Branco (Tornar Fundo Transparente)
          </label>
        </div>
      </div>
      <div class="btn-group">
        <button onclick="closeImageModal()">Cancelar</button>
        <button class="accent-btn" onclick="confirmCrop()">Confirmar e Importar como Solta</button>
      </div>
    </div>
  </div>

  <script>
    // Função auxiliar universal para ativar suavização em qualquer contexto 2D
    function applySmoothing(context) {
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = 'high';
    }

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    applySmoothing(ctx);

    const timelineCanvas = document.getElementById('timeline-canvas');
    const tCtx = timelineCanvas.getContext('2d');
    applySmoothing(tCtx);

    let stageZoom = 1;
    let stagePan = { x: 0, y: 0 };
    let isStagePanning = false;
    let stagePanStart = { x: 0, y: 0 };
    let unselectedOpacity = 0.75;

    let onionSkinEnabled = false;
    let onionSkinCount = 3;

    let mode = 'ADD_BONE_ROOT'; 
    let transformTarget = 'BONE';
    let bones = [];
    let unattachedImages = []; 
    let selectedBone = null;
    let isMouseDown = false;

    let dragMode = null;
    let dragStartPos = null;
    let dragInitialState = {};
    let currentDrawingStroke = [];

    let undoStack = [];

    let isResizingTimeline = false;
    let isScrubbingTimeline = false;

    let currentFrame = 0;
    let maxFrames = 60;
    let fps = 24;
    let boneKeyframes = {};
    let isPlaying = false;
    let animationInterval = null;

    let loadedImage = null;
    let polyPoints = [];
    let isPolyClosed = false;
    let cropZoom = 1;
    let cropPan = { x: 0, y: 0 };
    let isPanning = false;
    let panStart = { x: 0, y: 0 };

    const cropCanvas = document.getElementById('crop-canvas');
    const cropCtx = cropCanvas.getContext('2d');
    applySmoothing(cropCtx);

    makeDraggable(document.getElementById("floating-menu"), document.getElementById("floating-menu-header"));

    function makeDraggable(elmnt, header) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      header.onmousedown = dragMouseDown;

      function dragMouseDown(e) {
        e = e || window.event;
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e = e || window.event;
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        elmnt.style.right = "auto";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }

    function updateUnselectedOpacity(val) {
      unselectedOpacity = parseFloat(val);
      document.getElementById('lbl-unselected-opacity').innerText = `Opacidade dos Não Selecionados: ${Math.round(unselectedOpacity * 100)}%`;
      render();
    }

    function toggleOnionSkin(val) {
      onionSkinEnabled = val;
      render();
    }

    function updateOnionCount(val) {
      onionSkinCount = Math.max(1, Math.min(10, parseInt(val) || 3));
      if (onionSkinEnabled) render();
    }

    function saveState() {
      undoStack.push(serializeProject());
      if (undoStack.length > 30) undoStack.shift();
    }

    function undo() {
      if (undoStack.length > 0) {
        const previousState = undoStack.pop();
        deserializeProject(previousState, false);
      }
    }

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undo();
      }
    });

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const container = timelineCanvas.parentElement;
      timelineCanvas.width = container.clientWidth;
      timelineCanvas.height = Math.max(120, (bones.length + 1) * 24 + 30);

      applySmoothing(ctx);
      applySmoothing(tCtx);

      render();
      drawTimelineCanvas();
    }
    window.addEventListener('resize', resizeCanvas);

    function screenToWorld(sp) {
      return {
        x: (sp.x - stagePan.x) / stageZoom,
        y: (sp.y - stagePan.y) / stageZoom
      };
    }

    function worldToScreen(wp) {
      return {
        x: wp.x * stageZoom + stagePan.x,
        y: wp.y * stageZoom + stagePan.y
      };
    }

    function resetStageZoom() {
      stageZoom = 1;
      stagePan = { x: 0, y: 0 };
      render();
    }

    class Bone {
      constructor(id, parent, length, angle, basePos = {x: 0, y: 0}) {
        this.id = id;
        this.parent = parent;
        this.length = length;
        this.localAngle = angle;
        this.posX = basePos.x;
        this.posY = basePos.y;
        this.meshStrokes = [];
        this.attachedSprite = null; 

        this.visibleBone = true;
        this.visibleImage = true;

        this.startX = 0;
        this.startY = 0;
        this.endX = 0;
        this.endY = 0;
        this.worldAngle = 0;
      }

      updateTransform() {
        if (this.parent) {
          this.startX = this.parent.endX + this.posX;
          this.startY = this.parent.endY + this.posY;
          this.worldAngle = this.parent.worldAngle + this.localAngle;
        } else {
          this.startX = this.posX;
          this.startY = this.posY;
          this.worldAngle = this.localAngle;
        }

        this.endX = this.startX + Math.cos(this.worldAngle) * this.length;
        this.endY = this.startY + Math.sin(this.worldAngle) * this.length;
      }

      worldToLocal(point) {
        const dx = point.x - this.startX;
        const dy = point.y - this.startY;
        const cos = Math.cos(-this.worldAngle);
        const sin = Math.sin(-this.worldAngle);
        return { x: dx * cos - dy * sin, y: dx * sin + dy * cos };
      }

      localToWorld(point) {
        const cos = Math.cos(this.worldAngle);
        const sin = Math.sin(this.worldAngle);
        return {
          x: this.startX + (point.x * cos - point.y * sin),
          y: this.startY + (point.x * sin + point.y * cos)
        };
      }
    }

    function setMode(newMode) {
      mode = newMode;
      document.querySelectorAll('#sidebar button').forEach(b => b.classList.remove('active'));

      if (mode === 'ADD_BONE_ROOT') document.getElementById('btn-mode-bone-root').classList.add('active');
      if (mode === 'ADD_BONE_CHILD') document.getElementById('btn-mode-bone-child').classList.add('active');
      if (mode === 'DRAW_MESH') document.getElementById('btn-mode-draw').classList.add('active');
      if (mode === 'POSE') document.getElementById('btn-mode-pose').classList.add('active');

      document.getElementById('pose-controls').style.display = (mode === 'POSE') ? 'flex' : 'none';
      render();
    }

    function setTransformTarget(target) {
      transformTarget = target;
      document.getElementById('btn-target-bone').classList.toggle('active', target === 'BONE');
      document.getElementById('btn-target-image').classList.toggle('active', target === 'IMAGE');

      document.getElementById('bone-transform-box').style.display = (target === 'BONE') ? 'flex' : 'none';
      document.getElementById('image-transform-box').style.display = (target === 'IMAGE') ? 'flex' : 'none';

      if (target === 'IMAGE') updateSpritePanel();
      render();
    }

    function getSpriteBoundingBox(bone) {
      if (!bone || !bone.attachedSprite || !bone.visibleImage) return null;
      const sprite = bone.attachedSprite;
      const w = sprite.imageCanvas.width * sprite.scale;
      const h = sprite.imageCanvas.height * sprite.scale;

      const spriteWorldAngle = bone.worldAngle + sprite.rot;
      const cos = Math.cos(bone.worldAngle);
      const sin = Math.sin(bone.worldAngle);

      const centerWorld = {
        x: bone.startX + (sprite.offX * cos - sprite.offY * sin),
        y: bone.startY + (sprite.offX * sin + sprite.offY * cos)
      };

      return { sprite, w, h, centerWorld, spriteWorldAngle };
    }

    function getSelectedSpriteBoundingBox() {
      return getSpriteBoundingBox(selectedBone);
    }

    function isPointInSprite(worldPos, bone) {
      const bbox = getSpriteBoundingBox(bone);
      if (!bbox) return false;

      const dx = worldPos.x - bbox.centerWorld.x;
      const dy = worldPos.y - bbox.centerWorld.y;

      const cos = Math.cos(-bbox.spriteWorldAngle);
      const sin = Math.sin(-bbox.spriteWorldAngle);

      const localX = dx * cos - dy * sin;
      const localY = dx * sin + dy * cos;

      return Math.abs(localX) <= bbox.w / 2 && Math.abs(localY) <= bbox.h / 2;
    }

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const screenPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };

      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const newZoom = Math.max(0.1, Math.min(10, stageZoom * zoomFactor));

      stagePan.x = screenPos.x - (screenPos.x - stagePan.x) * (newZoom / stageZoom);
      stagePan.y = screenPos.y - (screenPos.y - stagePan.y) * (newZoom / stageZoom);
      stageZoom = newZoom;

      render();
    });

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const screenPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      const worldPos = screenToWorld(screenPos);
      isMouseDown = true;
      dragMode = null;

      if (e.button === 2) {
        isStagePanning = true;
        stagePanStart = { x: screenPos.x - stagePan.x, y: screenPos.y - stagePan.y };
        return;
      }

      if (mode === 'ADD_BONE_ROOT') {
        dragStartPos = worldPos;
      }
      else if (mode === 'ADD_BONE_CHILD') {
        if (!selectedBone && bones.length > 0) {
          selectedBone = bones[bones.length - 1];
        }
        dragStartPos = selectedBone ? { x: selectedBone.endX, y: selectedBone.endY } : worldPos;
      } 
      else if (mode === 'DRAW_MESH') {
        if (!selectedBone && bones.length > 0) selectedBone = bones[0];
        if (selectedBone) {
          currentDrawingStroke = [selectedBone.worldToLocal(worldPos)];
        }
      } 
      else if (mode === 'POSE') {
        let hitSpriteBone = null;
        for (let i = bones.length - 1; i >= 0; i--) {
          if (bones[i].visibleImage && isPointInSprite(worldPos, bones[i])) {
            hitSpriteBone = bones[i];
            break;
          }
        }

        let closestBone = null;
        let minDist = 25 / stageZoom;
        let activeAnchorType = null;

        bones.forEach(b => {
          if (!b.visibleBone) return;
          const rootDist = Math.hypot(b.startX - worldPos.x, b.startY - worldPos.y);
          const tipDist = Math.hypot(b.endX - worldPos.x, b.endY - worldPos.y);

          const midX = (b.startX + b.endX) / 2;
          const midY = (b.startY + b.endY) / 2;
          const scaleDist = Math.hypot(midX - worldPos.x, midY - worldPos.y);

          if (rootDist < minDist) {
            minDist = rootDist; closestBone = b; activeAnchorType = 'ROOT';
          }
          if (scaleDist < minDist) {
            minDist = scaleDist; closestBone = b; activeAnchorType = 'SCALE';
          }
          if (tipDist < minDist) {
            minDist = tipDist; closestBone = b; activeAnchorType = 'TIP';
          }
        });

        if (closestBone) {
          selectBone(closestBone);
          setTransformTarget('BONE');
          dragStartPos = worldPos;
          saveState();

          if (activeAnchorType === 'ROOT') dragMode = 'BONE_TRANSLATE';
          else if (activeAnchorType === 'SCALE') {
            dragMode = 'BONE_SCALE';
            dragInitialState = { length: closestBone.length };
          }
          else if (activeAnchorType === 'TIP') dragMode = 'BONE_ROTATE';
        } else if (hitSpriteBone) {
          selectBone(hitSpriteBone);
          setTransformTarget('IMAGE');
          const bbox = getSelectedSpriteBoundingBox();
          if (bbox) {
            const rotHandleDist = Math.hypot(worldPos.x - (bbox.centerWorld.x + Math.sin(bbox.spriteWorldAngle) * (bbox.h/2 + 25)), worldPos.y - (bbox.centerWorld.y - Math.cos(bbox.spriteWorldAngle) * (bbox.h/2 + 25)));
            if (rotHandleDist < 18 / stageZoom) {
              dragMode = 'SPRITE_ROTATE';
              dragStartPos = worldPos;
              dragInitialState = { rot: bbox.sprite.rot };
              saveState();
              return;
            }

            const scaleHandleDist = Math.hypot(worldPos.x - (bbox.centerWorld.x + Math.cos(bbox.spriteWorldAngle) * bbox.w/2 + Math.sin(bbox.spriteWorldAngle) * bbox.h/2), worldPos.y - (bbox.centerWorld.y + Math.sin(bbox.spriteWorldAngle) * bbox.w/2 - Math.cos(bbox.spriteWorldAngle) * bbox.h/2));
            if (scaleHandleDist < 18 / stageZoom) {
              dragMode = 'SPRITE_SCALE';
              dragStartPos = worldPos;
              dragInitialState = { scale: bbox.sprite.scale, dist: Math.hypot(worldPos.x - bbox.centerWorld.x, worldPos.y - bbox.centerWorld.y) };
              saveState();
              return;
            }

            dragMode = 'SPRITE_TRANSLATE';
            dragStartPos = worldPos;
            dragInitialState = { offX: bbox.sprite.offX, offY: bbox.sprite.offY };
            saveState();
          }
        }
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const screenPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      const worldPos = screenToWorld(screenPos);

      if (isStagePanning) {
        stagePan.x = screenPos.x - stagePanStart.x;
        stagePan.y = screenPos.y - stagePanStart.y;
        render();
        return;
      }

      if (!isMouseDown) return;

      if ((mode === 'ADD_BONE_ROOT' || mode === 'ADD_BONE_CHILD') && dragStartPos) {
        render();
        const startScreen = worldToScreen(dragStartPos);
        ctx.beginPath();
        ctx.moveTo(startScreen.x, startScreen.y);
        ctx.lineTo(screenPos.x, screenPos.y);
        ctx.strokeStyle = '#00d2ff';
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
      } 
      else if (mode === 'DRAW_MESH' && selectedBone) {
        currentDrawingStroke.push(selectedBone.worldToLocal(worldPos));
        render();

        ctx.save();
        ctx.translate(stagePan.x, stagePan.y);
        ctx.scale(stageZoom, stageZoom);
        ctx.beginPath();
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 3 / stageZoom;
        for (let i = 0; i < currentDrawingStroke.length - 1; i++) {
          const pt1 = selectedBone.localToWorld(currentDrawingStroke[i]);
          const pt2 = selectedBone.localToWorld(currentDrawingStroke[i + 1]);
          ctx.moveTo(pt1.x, pt1.y);
          ctx.lineTo(pt2.x, pt2.y);
        }
        ctx.stroke();
        ctx.restore();
      }
      else if (mode === 'POSE' && selectedBone) {
        if (dragMode === 'BONE_TRANSLATE') {
          const dx = worldPos.x - dragStartPos.x;
          const dy = worldPos.y - dragStartPos.y;
          selectedBone.posX += dx;
          selectedBone.posY += dy;
          dragStartPos = worldPos;
          addKeyframeAuto();
          updateUI();
          render();
        } 
        else if (dragMode === 'BONE_SCALE') {
          const dx = worldPos.x - selectedBone.startX;
          const dy = worldPos.y - selectedBone.startY;
          const projLen = dx * Math.cos(selectedBone.worldAngle) + dy * Math.sin(selectedBone.worldAngle);
          selectedBone.length = Math.max(10, projLen);
          addKeyframeAuto();
          updateUI();
          render();
        }
        else if (dragMode === 'BONE_ROTATE') {
          const baseAngle = selectedBone.parent ? selectedBone.parent.worldAngle : 0;
          const newWorldAngle = Math.atan2(worldPos.y - selectedBone.startY, worldPos.x - selectedBone.startX);
          selectedBone.localAngle = newWorldAngle - baseAngle;
          addKeyframeAuto();
          updateUI();
          render();
        }
        else if (dragMode === 'SPRITE_TRANSLATE' && selectedBone.attachedSprite) {
          const sprite = selectedBone.attachedSprite;
          const dx = worldPos.x - dragStartPos.x;
          const dy = worldPos.y - dragStartPos.y;
          const cos = Math.cos(-selectedBone.worldAngle);
          const sin = Math.sin(-selectedBone.worldAngle);

          sprite.offX += dx * cos - dy * sin;
          sprite.offY += dx * sin + dy * cos;
          dragStartPos = worldPos;
          updateUI();
          render();
        }
        else if (dragMode === 'SPRITE_ROTATE' && selectedBone.attachedSprite) {
          const bbox = getSelectedSpriteBoundingBox();
          if (bbox) {
            const angle = Math.atan2(worldPos.y - bbox.centerWorld.y, worldPos.x - bbox.centerWorld.x);
            bbox.sprite.rot = angle - selectedBone.worldAngle + Math.PI/2;
            updateUI();
            render();
          }
        }
        else if (dragMode === 'SPRITE_SCALE' && selectedBone.attachedSprite) {
          const bbox = getSelectedSpriteBoundingBox();
          if (bbox && dragInitialState.dist > 0) {
            const currentDist = Math.hypot(worldPos.x - bbox.centerWorld.x, worldPos.y - bbox.centerWorld.y);
            bbox.sprite.scale = Math.max(0.05, dragInitialState.scale * (currentDist / dragInitialState.dist));
            updateUI();
            render();
          }
        }
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      if (e.button === 2) {
        isStagePanning = false;
      }

      const rect = canvas.getBoundingClientRect();
      const screenPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      const worldPos = screenToWorld(screenPos);

      if ((mode === 'ADD_BONE_ROOT' || mode === 'ADD_BONE_CHILD') && isMouseDown && dragStartPos && e.button === 0) {
        const dx = worldPos.x - dragStartPos.x;
        const dy = worldPos.y - dragStartPos.y;
        const length = Math.hypot(dx, dy);

        if (length > 15) {
          saveState();
          let parentBone = (mode === 'ADD_BONE_CHILD') ? selectedBone : null;
          let worldAngle = Math.atan2(dy, dx);
          let localAngle = parentBone ? worldAngle - parentBone.worldAngle : worldAngle;

          let basePos = { x: dragStartPos.x, y: dragStartPos.y };
          if (parentBone) {
            basePos = { x: dragStartPos.x - parentBone.endX, y: dragStartPos.y - parentBone.endY };
          }

          const newBone = new Bone(`Osso_${bones.length + 1}`, parentBone, length, localAngle, basePos);
          bones.push(newBone);
          boneKeyframes[newBone.id] = {};
          selectBone(newBone);
          setTransformTarget('BONE');
          resizeCanvas();
        }
      } 
      else if (mode === 'DRAW_MESH' && isMouseDown && selectedBone && e.button === 0) {
        if (currentDrawingStroke.length > 1) {
          saveState();
          selectedBone.meshStrokes.push([...currentDrawingStroke]);
        }
        currentDrawingStroke = [];
      }

      isMouseDown = false;
      dragMode = null;
      dragStartPos = null;
      render();
    });

    const angleSlider = document.getElementById('angle-slider');
    const boneLenSlider = document.getElementById('bone-len-slider');
    const bonePosXSlider = document.getElementById('bone-posx-slider');
    const bonePosYSlider = document.getElementById('bone-posy-slider');

    angleSlider.addEventListener('input', (e) => {
      if (selectedBone && mode === 'POSE' && transformTarget === 'BONE') {
        selectedBone.localAngle = (e.target.value * Math.PI) / 180;
        addKeyframeAuto();
        render();
      }
    });

    boneLenSlider.addEventListener('input', (e) => {
      if (selectedBone && mode === 'POSE' && transformTarget === 'BONE') {
        selectedBone.length = parseFloat(e.target.value);
        addKeyframeAuto();
        render();
      }
    });

    bonePosXSlider.addEventListener('input', (e) => {
      if (selectedBone && mode === 'POSE' && transformTarget === 'BONE') {
        selectedBone.posX = parseFloat(e.target.value);
        addKeyframeAuto();
        render();
      }
    });

    bonePosYSlider.addEventListener('input', (e) => {
      if (selectedBone && mode === 'POSE' && transformTarget === 'BONE') {
        selectedBone.posY = parseFloat(e.target.value);
        addKeyframeAuto();
        render();
      }
    });

    function reorderBone(bone, direction) {
      const index = bones.indexOf(bone);
      const targetIndex = index + direction;

      if (targetIndex >= 0 && targetIndex < bones.length) {
        saveState();
        const temp = bones[index];
        bones[index] = bones[targetIndex];
        bones[targetIndex] = temp;
        updateUI();
        resizeCanvas();
      }
    }

    const offXSlider = document.getElementById('sprite-offx');
    const offYSlider = document.getElementById('sprite-offy');
    const scaleSlider = document.getElementById('sprite-scale');
    const rotSlider = document.getElementById('sprite-rot');

    function updateSpriteFromSliders() {
      if (selectedBone && selectedBone.attachedSprite && transformTarget === 'IMAGE') {
        const sprite = selectedBone.attachedSprite;
        sprite.offX = parseFloat(offXSlider.value);
        sprite.offY = parseFloat(offYSlider.value);
        sprite.scale = parseFloat(scaleSlider.value);
        sprite.rot = (parseFloat(rotSlider.value) * Math.PI) / 180;
        render();
      }
    }

    [offXSlider, offYSlider, scaleSlider, rotSlider].forEach(s => s.addEventListener('input', updateSpriteFromSliders));

    function selectBone(bone) {
      selectedBone = bone;
      if (mode !== 'POSE') {
        setMode('POSE');
      }
      updateUI();
      render();
    }

    function updateSpritePanel() {
      const infoText = document.getElementById('attached-image-info');
      const editorBox = document.getElementById('sprite-editor-controls');

      if (!selectedBone || !selectedBone.attachedSprite) {
        infoText.innerText = "Nenhuma imagem associada a este osso.";
        editorBox.style.display = 'none';
        return;
      }

      editorBox.style.display = 'flex';
      const sprite = selectedBone.attachedSprite;
      infoText.innerText = `Imagem: ${sprite.name}`;

      offXSlider.value = sprite.offX;
      offYSlider.value = sprite.offY;
      scaleSlider.value = sprite.scale;
      rotSlider.value = Math.round((sprite.rot * 180) / Math.PI);

      render();
    }

    function updateUnattachedImagesList() {
      const select = document.getElementById('unattached-select');
      select.innerHTML = '';

      if (unattachedImages.length === 0) {
        select.innerHTML = '<option value="-1">Nenhuma imagem solta</option>';
        return;
      }

      unattachedImages.forEach((imgObj, idx) => {
        const option = document.createElement('option');
        option.value = idx;
        option.text = imgObj.name || `Imagem Solta #${idx + 1}`;
        select.appendChild(option);
      });
    }

    function attachUnattachedImageToSelectedBone() {
      if (!selectedBone) {
        alert("Selecione um osso na tela antes para associar a imagem.");
        return;
      }

      const select = document.getElementById('unattached-select');
      const idx = parseInt(select.value);

      if (idx >= 0 && unattachedImages[idx]) {
        saveState();
        
        if (selectedBone.attachedSprite) {
          unattachedImages.push(selectedBone.attachedSprite);
        }

        const newSprite = unattachedImages.splice(idx, 1)[0];
        selectedBone.attachedSprite = newSprite;

        setTransformTarget('IMAGE');
        updateUI();
        render();
      }
    }

    function detachSelectedSprite() {
      if (!selectedBone || !selectedBone.attachedSprite) return;

      saveState();
      const sprite = selectedBone.attachedSprite;
      selectedBone.attachedSprite = null;
      unattachedImages.push(sprite);

      updateUI();
      render();
    }

    function updateUI() {
      const infoBox = document.getElementById('hierarchy-info');
      const lblName = document.getElementById('lbl-bone-name');

      if (selectedBone) {
        const imageName = selectedBone.attachedSprite ? selectedBone.attachedSprite.name : 'Nenhuma';
        infoBox.innerHTML = `
          <b>Osso Selecionado:</b> ${selectedBone.id}<br>
          <b>Imagem Associada:</b> ${imageName}<br>
          <b>Comprimento:</b> ${Math.round(selectedBone.length)}px<br>
          <b>Posição Relativa:</b> X:${Math.round(selectedBone.posX)}, Y:${Math.round(selectedBone.posY)}<br>
          <b>Pai:</b> ${selectedBone.parent ? selectedBone.parent.id : 'Nenhum'}
        `;

        lblName.innerText = `Rotacionar Osso: ${selectedBone.id}`;
        angleSlider.value = Math.round((selectedBone.localAngle * 180) / Math.PI);
        boneLenSlider.value = Math.round(selectedBone.length);
        bonePosXSlider.value = Math.round(selectedBone.posX);
        bonePosYSlider.value = Math.round(selectedBone.posY);

        updateSpritePanel();
      } else {
        infoBox.innerHTML = 'Nenhum osso selecionado.';
      }

      updateUnattachedImagesList();

      document.getElementById('frame-counter').innerText = `Frame: ${currentFrame} / ${maxFrames}`;
      const kf = selectedBone && boneKeyframes[selectedBone.id] && boneKeyframes[selectedBone.id][currentFrame];
      const hasKeyframe = !!kf;
      document.getElementById('keyframe-info').innerText = hasKeyframe ? '★ KEYFRAME (KF) GRAVADO' : '';

      const btnInterp = document.getElementById('btn-toggle-interp');
      if (hasKeyframe) {
        btnInterp.disabled = false;
        const isInterp = kf.interpolated !== false;
        btnInterp.innerText = isInterp ? '⚡ Interpolando' : '⏹️ Estática (Hold)';
        btnInterp.className = isInterp ? 'accent-btn' : 'warning-btn';
      } else {
        btnInterp.disabled = true;
        btnInterp.innerText = '⚡ Interpolação';
        btnInterp.className = '';
      }

      renderBoneLayersPanel();
      drawTimelineCanvas();
    }

    function toggleBoneVisibility(bone) {
      bone.visibleBone = !bone.visibleBone;
      renderBoneLayersPanel();
      render();
    }

    function toggleImageVisibility(bone) {
      bone.visibleImage = !bone.visibleImage;
      renderBoneLayersPanel();
      render();
    }

    function renderBoneLayersPanel() {
      const panel = document.getElementById('bone-layers-panel');
      panel.innerHTML = '';

      bones.forEach((bone) => {
        const row = document.createElement('div');
        row.className = 'bone-layer-row' + (bone === selectedBone ? ' active' : '');

        const label = document.createElement('span');
        label.className = 'bone-layer-label';
        label.innerText = bone.id;
        label.title = bone.id;
        label.onclick = () => {
          selectBone(bone);
          setTransformTarget('BONE');
        };
        label.ondblclick = () => {
          const newName = prompt("Digite o novo nome para o osso:", bone.id);
          if (newName && newName.trim() !== "") {
            saveState();
            const oldId = bone.id;
            const trimmedName = newName.trim();
            bone.id = trimmedName;

            if (boneKeyframes[oldId]) {
              boneKeyframes[trimmedName] = boneKeyframes[oldId];
              delete boneKeyframes[oldId];
            }

            updateUI();
            render();
          }
        };

        const btnGroup = document.createElement('div');
        btnGroup.className = 'layer-btn-group';

        const btnBoneVis = document.createElement('button');
        btnBoneVis.className = 'btn-layer-toggle' + (!bone.visibleBone ? ' hidden-item' : '');
        btnBoneVis.innerText = '👁️';
        btnBoneVis.title = bone.visibleBone ? 'Ocultar Osso' : 'Exibir Osso';
        btnBoneVis.onclick = (e) => { e.stopPropagation(); toggleBoneVisibility(bone); };

        const btnImgVis = document.createElement('button');
        btnImgVis.className = 'btn-layer-toggle' + (!bone.visibleImage ? ' hidden-item' : '');
        btnImgVis.innerText = '🖼️';
        btnImgVis.title = bone.visibleImage ? 'Ocultar Imagem' : 'Exibir Imagem';
        btnImgVis.onclick = (e) => { e.stopPropagation(); toggleImageVisibility(bone); };

        const btnUp = document.createElement('button');
        btnUp.className = 'btn-layer-order';
        btnUp.innerText = '⬆';
        btnUp.title = 'Mover Para Trás (Camada Inferior)';
        btnUp.onclick = (e) => { e.stopPropagation(); reorderBone(bone, -1); };

        const btnDown = document.createElement('button');
        btnDown.className = 'btn-layer-order';
        btnDown.innerText = '⬇';
        btnDown.title = 'Mover Para Frente (Camada Superior)';
        btnDown.onclick = (e) => { e.stopPropagation(); reorderBone(bone, 1); };

        btnGroup.appendChild(btnBoneVis);
        btnGroup.appendChild(btnImgVis);
        btnGroup.appendChild(btnUp);
        btnGroup.appendChild(btnDown);

        row.appendChild(label);
        row.appendChild(btnGroup);
        panel.appendChild(row);
      });
    }

    function removeSelectedSprite() {
      if (selectedBone && selectedBone.attachedSprite) {
        if (confirm("Tem certeza de que deseja excluir esta imagem permanentemente?")) {
          saveState();
          selectedBone.attachedSprite = null;
          updateUI();
          render();
        }
      }
    }

    function clearAll() {
      saveState();
      bones = [];
      unattachedImages = [];
      selectedBone = null;
      currentDrawingStroke = [];
      boneKeyframes = {};
      updateUI();
      resizeCanvas();
    }

    function updateMaxFrames(val) {
      maxFrames = Math.max(5, parseInt(val) || 60);
      if (currentFrame > maxFrames) currentFrame = maxFrames;
      updateUI();
    }

    function updateFPS(val) {
      fps = Math.max(1, Math.min(120, parseInt(val) || 24));
      if (isPlaying) {
        togglePlay();
        togglePlay();
      }
    }

    function drawTimelineCanvas() {
      const w = timelineCanvas.width;
      const h = timelineCanvas.height;
      applySmoothing(tCtx);
      tCtx.clearRect(0, 0, w, h);

      const headerHeight = 30;
      const trackHeight = 24;
      const paddingRight = 20;

      const trackWidth = w - paddingRight;
      const step = trackWidth / maxFrames;

      tCtx.fillStyle = '#18181f';
      tCtx.fillRect(0, 0, w, headerHeight);

      tCtx.strokeStyle = '#3f3f52';
      tCtx.lineWidth = 1;
      tCtx.fillStyle = '#888';
      tCtx.font = '10px sans-serif';
      tCtx.textAlign = 'center';

      for (let i = 0; i <= maxFrames; i += 5) {
        const x = i * step;
        tCtx.beginPath();
        tCtx.moveTo(x, 0);
        tCtx.lineTo(x, 10);
        tCtx.stroke();
        tCtx.fillText(i, x, 22);
      }

      const resizeHandleX = maxFrames * step;
      tCtx.fillStyle = '#00d2ff';
      tCtx.fillRect(resizeHandleX - 4, 0, 8, headerHeight);
      tCtx.fillStyle = '#000';
      tCtx.fillText('⇹', resizeHandleX, 18);

      bones.forEach((bone, index) => {
        const y = headerHeight + index * trackHeight;
        const trackCenterY = y + trackHeight / 2;

        tCtx.fillStyle = (bone === selectedBone) ? '#2a2a3a' : (index % 2 === 0 ? '#14141a' : '#18181f');
        tCtx.fillRect(0, y, w, trackHeight);

        tCtx.strokeStyle = '#2b2b36';
        tCtx.beginPath();
        tCtx.moveTo(0, y + trackHeight);
        tCtx.lineTo(w, y + trackHeight);
        tCtx.stroke();

        const kfs = boneKeyframes[bone.id] || {};
        const activeFrames = Object.keys(kfs).map(Number).sort((a, b) => a - b);

        for (let i = 0; i < activeFrames.length - 1; i++) {
          const f1 = activeFrames[i];
          const f2 = activeFrames[i + 1];

          if (f1 <= maxFrames) {
            const x1 = f1 * step;
            const x2 = Math.min(f2, maxFrames) * step;
            const isInterp = kfs[f1].interpolated !== false;

            tCtx.beginPath();
            tCtx.moveTo(x1, trackCenterY);
            tCtx.lineTo(x2, trackCenterY);
            tCtx.lineWidth = 2;
            tCtx.strokeStyle = isInterp ? '#00d2ff' : '#d97706';
            if (!isInterp) {
              tCtx.setLineDash([3, 3]);
            } else {
              tCtx.setLineDash([]);
            }
            tCtx.stroke();
            tCtx.setLineDash([]);
          }
        }

        activeFrames.forEach(f => {
          if (f <= maxFrames) {
            const kx = f * step;

            tCtx.beginPath();
            tCtx.arc(kx, trackCenterY, 5, 0, Math.PI * 2);
            tCtx.fillStyle = (kfs[f].interpolated === false) ? '#d97706' : '#ffcc00';
            tCtx.fill();
            tCtx.strokeStyle = '#000';
            tCtx.lineWidth = 1;
            tCtx.stroke();
          }
        });
      });

      const currentX = currentFrame * step;
      tCtx.beginPath();
      tCtx.moveTo(currentX, 0);
      tCtx.lineTo(currentX, h);
      tCtx.strokeStyle = '#00d2ff';
      tCtx.lineWidth = 2;
      tCtx.stroke();

      tCtx.beginPath();
      tCtx.moveTo(currentX - 6, 0);
      tCtx.lineTo(currentX + 6, 0);
      tCtx.lineTo(currentX, 8);
      tCtx.closePath();
      tCtx.fillStyle = '#00d2ff';
      tCtx.fill();
    }

    timelineCanvas.addEventListener('mousedown', (e) => {
      const rect = timelineCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const headerHeight = 30;
      const trackHeight = 24;
      const paddingRight = 20;

      const trackWidth = timelineCanvas.width - paddingRight;
      const step = trackWidth / maxFrames;
      const resizeHandleX = maxFrames * step;

      if (Math.abs(clickX - resizeHandleX) <= 8 && clickY <= headerHeight) {
        isResizingTimeline = true;
        return;
      }

      if (clickY > headerHeight) {
        const boneIndex = Math.floor((clickY - headerHeight) / trackHeight);
        if (boneIndex >= 0 && boneIndex < bones.length) {
          selectBone(bones[boneIndex]);
          setTransformTarget('BONE');
        }
      }

      isScrubbingTimeline = true;
      updateFrameFromClick(clickX);
    });

    timelineCanvas.addEventListener('mousemove', (e) => {
      const rect = timelineCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const paddingRight = 20;

      if (isResizingTimeline) {
        const trackWidth = timelineCanvas.width - paddingRight;
        const newMax = Math.round((clickX / trackWidth) * maxFrames);
        if (newMax >= 5 && newMax <= 1000) {
          maxFrames = newMax;
          document.getElementById('max-frames-input').value = maxFrames;
          updateUI();
        }
        return;
      }

      if (isScrubbingTimeline) {
        updateFrameFromClick(clickX);
      }
    });

    window.addEventListener('mouseup', () => {
      isResizingTimeline = false;
      isScrubbingTimeline = false;
    });

    function updateFrameFromClick(clickX) {
      const paddingRight = 20;
      const trackWidth = timelineCanvas.width - paddingRight;
      const step = trackWidth / maxFrames;

      let frame = Math.round(clickX / step);
      frame = Math.max(0, Math.min(maxFrames, frame));

      currentFrame = frame;
      applyKeyframeState(currentFrame);
      updateUI();
      render();
    }

    function addKeyframeAuto() {
      if (!selectedBone) return;

      if (!boneKeyframes[selectedBone.id]) {
        boneKeyframes[selectedBone.id] = {};
      }

      const existingKf = boneKeyframes[selectedBone.id][currentFrame];
      boneKeyframes[selectedBone.id][currentFrame] = {
        angle: selectedBone.localAngle,
        posX: selectedBone.posX,
        posY: selectedBone.posY,
        length: selectedBone.length,
        interpolated: existingKf ? (existingKf.interpolated !== false) : true
      };
    }

    function toggleKeyframeInterpolation() {
      if (!selectedBone || !boneKeyframes[selectedBone.id] || !boneKeyframes[selectedBone.id][currentFrame]) return;
      saveState();
      const kf = boneKeyframes[selectedBone.id][currentFrame];
      kf.interpolated = (kf.interpolated === false);
      updateUI();
      render();
    }

    function addKeyframe() {
      if (!selectedBone) {
        alert("Selecione um osso para gravar seu keyframe.");
        return;
      }
      saveState();
      addKeyframeAuto();
      updateUI();
    }

    function removeKeyframe() {
      if (selectedBone && boneKeyframes[selectedBone.id]) {
        saveState();
        delete boneKeyframes[selectedBone.id][currentFrame];
        updateUI();
      }
    }

    function jumpToKeyframe(direction) {
      if (!selectedBone || !boneKeyframes[selectedBone.id]) return;

      const activeFrames = Object.keys(boneKeyframes[selectedBone.id]).map(Number).sort((a, b) => a - b);
      if (activeFrames.length === 0) return;

      if (direction > 0) {
        const next = activeFrames.find(f => f > currentFrame);
        if (next !== undefined) {
          currentFrame = next;
          applyKeyframeState(currentFrame);
          updateUI();
          render();
        }
      } else {
        const prev = activeFrames.filter(f => f < currentFrame).pop();
        if (prev !== undefined) {
          currentFrame = prev;
          applyKeyframeState(currentFrame);
          updateUI();
          render();
        }
      }
    }

    function calculateFrameState(frame) {
      const frameStateMap = {};
      bones.forEach(bone => {
        const kfs = boneKeyframes[bone.id];
        if (!kfs) {
          frameStateMap[bone.id] = { angle: bone.localAngle, posX: bone.posX, posY: bone.posY, length: bone.length };
          return;
        }

        const activeFrames = Object.keys(kfs).map(Number).sort((a, b) => a - b);
        if (activeFrames.length === 0) {
          frameStateMap[bone.id] = { angle: bone.localAngle, posX: bone.posX, posY: bone.posY, length: bone.length };
          return;
        }

        if (kfs[frame]) {
          frameStateMap[bone.id] = {
            angle: kfs[frame].angle,
            posX: kfs[frame].posX,
            posY: kfs[frame].posY,
            length: kfs[frame].length !== undefined ? kfs[frame].length : bone.length
          };
          return;
        }

        let prevFrame = null;
        let nextFrame = null;

        for (let f of activeFrames) {
          if (f <= frame) prevFrame = f;
          if (f >= frame && nextFrame === null) nextFrame = f;
        }

        if (prevFrame !== null && nextFrame !== null && prevFrame !== nextFrame) {
          if (kfs[prevFrame].interpolated === false) {
            frameStateMap[bone.id] = {
              angle: kfs[prevFrame].angle,
              posX: kfs[prevFrame].posX,
              posY: kfs[prevFrame].posY,
              length: kfs[prevFrame].length !== undefined ? kfs[prevFrame].length : bone.length
            };
          } else {
            const factor = (frame - prevFrame) / (nextFrame - prevFrame);
            const pLen = kfs[prevFrame].length || bone.length;
            const nLen = kfs[nextFrame].length || bone.length;

            frameStateMap[bone.id] = {
              angle: kfs[prevFrame].angle + (kfs[nextFrame].angle - kfs[prevFrame].angle) * factor,
              posX: kfs[prevFrame].posX + (kfs[nextFrame].posX - kfs[prevFrame].posX) * factor,
              posY: kfs[prevFrame].posY + (kfs[nextFrame].posY - kfs[prevFrame].posY) * factor,
              length: pLen + (nLen - pLen) * factor
            };
          }
        } else if (prevFrame !== null) {
          frameStateMap[bone.id] = {
            angle: kfs[prevFrame].angle,
            posX: kfs[prevFrame].posX,
            posY: kfs[prevFrame].posY,
            length: kfs[prevFrame].length !== undefined ? kfs[prevFrame].length : bone.length
          };
        } else {
          frameStateMap[bone.id] = { angle: bone.localAngle, posX: bone.posX, posY: bone.posY, length: bone.length };
        }
      });
      return frameStateMap;
    }

    function applyKeyframeState(frame) {
      const stateMap = calculateFrameState(frame);
      bones.forEach(bone => {
        if (stateMap[bone.id]) {
          bone.localAngle = stateMap[bone.id].angle;
          bone.posX = stateMap[bone.id].posX;
          bone.posY = stateMap[bone.id].posY;
          bone.length = stateMap[bone.id].length;
        }
      });
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('btn-play');

      if (isPlaying) {
        btn.innerText = '⏸ Pause';
        animationInterval = setInterval(() => {
          currentFrame = (currentFrame + 1) % (maxFrames + 1);
          applyKeyframeState(currentFrame);
          updateUI();
          render();
        }, 1000 / fps);
      } else {
        btn.innerText = '▶ Play';
        clearInterval(animationInterval);
      }
    }

    function serializeProject() {
      const projectData = {
        maxFrames: maxFrames,
        fps: fps,
        bones: bones.map(bone => ({
          id: bone.id,
          parentId: bone.parent ? bone.parent.id : null,
          length: bone.length,
          localAngle: bone.localAngle,
          posX: bone.posX,
          posY: bone.posY,
          meshStrokes: bone.meshStrokes,
          visibleBone: bone.visibleBone,
          visibleImage: bone.visibleImage,
          attachedSprite: bone.attachedSprite ? {
            name: bone.attachedSprite.name,
            offX: bone.attachedSprite.offX,
            offY: bone.attachedSprite.offY,
            scale: bone.attachedSprite.scale,
            rot: bone.attachedSprite.rot,
            dataUrl: bone.attachedSprite.imageCanvas.toDataURL()
          } : null
        })),
        unattachedImages: unattachedImages.map(s => ({
          name: s.name,
          offX: s.offX,
          offY: s.offY,
          scale: s.scale,
          rot: s.rot,
          dataUrl: s.imageCanvas.toDataURL()
        })),
        boneKeyframes: boneKeyframes
      };
      return JSON.stringify(projectData);
    }

    function deserializeProject(jsonString, alertOnSuccess = true) {
      try {
        const data = JSON.parse(jsonString);
        bones = [];
        unattachedImages = [];
        selectedBone = null;
        maxFrames = data.maxFrames || 60;
        fps = data.fps || 24;
        document.getElementById('max-frames-input').value = maxFrames;
        document.getElementById('fps-input').value = fps;
        boneKeyframes = data.boneKeyframes || {};

        const boneMap = {};

        data.bones.forEach(bData => {
          const bone = new Bone(bData.id, null, bData.length, bData.localAngle, { x: bData.posX || 0, y: bData.posY || 0 });
          bone.meshStrokes = bData.meshStrokes || [];
          bone.visibleBone = bData.visibleBone !== undefined ? bData.visibleBone : true;
          bone.visibleImage = bData.visibleImage !== undefined ? bData.visibleImage : true;
          boneMap[bData.id] = { instance: bone, parentId: bData.parentId, rawSprite: bData.attachedSprite };
          bones.push(bone);
        });

        if (data.unattachedImages) {
          data.unattachedImages.forEach(sData => {
            const img = new Image();
            img.onload = () => {
              const offCanvas = document.createElement('canvas');
              offCanvas.width = img.width;
              offCanvas.height = img.height;
              const oCtx = offCanvas.getContext('2d');
              applySmoothing(oCtx);
              oCtx.drawImage(img, 0, 0);

              unattachedImages.push({
                name: sData.name,
                imageCanvas: offCanvas,
                offX: sData.offX,
                offY: sData.offY,
                scale: sData.scale,
                rot: sData.rot
              });
              updateUI();
              render();
            };
            img.src = sData.dataUrl;
          });
        }

        bones.forEach(bone => {
          const raw = boneMap[bone.id];
          if (raw.parentId && boneMap[raw.parentId]) {
            bone.parent = boneMap[raw.parentId].instance;
          }

          if (raw.rawSprite) {
            const sData = raw.rawSprite;
            const img = new Image();
            img.onload = () => {
              const offCanvas = document.createElement('canvas');
              offCanvas.width = img.width;
              offCanvas.height = img.height;
              const oCtx = offCanvas.getContext('2d');
              applySmoothing(oCtx);
              oCtx.drawImage(img, 0, 0);

              bone.attachedSprite = {
                name: sData.name,
                imageCanvas: offCanvas,
                offX: sData.offX,
                offY: sData.offY,
                scale: sData.scale,
                rot: sData.rot
              };
              render();
            };
            img.src = sData.dataUrl;
          }
        });

        if (bones.length > 0) selectBone(bones[0]);
        resizeCanvas();
        if (alertOnSuccess) alert("Projeto carregado com sucesso!");
      } catch (err) {
        alert("Erro ao carregar dados do projeto.");
        console.error(err);
      }
    }

    function saveToLocalStorage() {
      localStorage.setItem('2d_rigging_project_v3', serializeProject());
      alert("Projeto salvo localmente!");
    }

    function loadFromLocalStorage() {
      saveState();
      const data = localStorage.getItem('2d_rigging_project_v3');
      if (data) deserializeProject(data);
      else alert("Nenhum projeto salvo encontrado.");
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(serializeProject());
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "rig_animation_project.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;

      saveState();
      const reader = new FileReader();
      reader.onload = (event) => deserializeProject(event.target.result);
      reader.readAsText(file);
    }

    function openImageModal() {
      document.getElementById('image-modal').style.display = 'flex';
      const container = document.getElementById('crop-canvas-container');
      cropCanvas.width = container.clientWidth;
      cropCanvas.height = container.clientHeight;
      applySmoothing(cropCtx);
      drawCropCanvas();
    }

    function closeImageModal() {
      document.getElementById('image-modal').style.display = 'none';
      polyPoints = [];
      isPolyClosed = false;
    }

    document.getElementById('image-loader').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImage = new Image();
        loadedImage.onload = () => resetCropZoom();
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function resetCropZoom() {
      if (!loadedImage) return;
      cropZoom = Math.min(cropCanvas.width / loadedImage.width, cropCanvas.height / loadedImage.height) * 0.9;
      cropPan.x = (cropCanvas.width - loadedImage.width * cropZoom) / 2;
      cropPan.y = (cropCanvas.height - loadedImage.height * cropZoom) / 2;
      polyPoints = [];
      isPolyClosed = false;
      drawCropCanvas();
    }

    function canvasToImageCoords(cx, cy) {
      return { x: (cx - cropPan.x) / cropZoom, y: (cy - cropPan.y) / cropZoom };
    }

    function imageToCanvasCoords(ix, iy) {
      return { x: ix * cropZoom + cropPan.x, y: iy * cropZoom + cropPan.y };
    }

    cropCanvas.addEventListener('mousedown', (e) => {
      if (!loadedImage) return;
      const rect = cropCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      if (e.button === 2) {
        isPanning = true;
        panStart = { x: mx - cropPan.x, y: my - cropPan.y };
        return;
      }

      if (e.button === 0 && !isPolyClosed) {
        polyPoints.push(canvasToImageCoords(mx, my));
        drawCropCanvas();
      }
    });

    cropCanvas.addEventListener('mousemove', (e) => {
      const rect = cropCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      if (isPanning) {
        cropPan.x = mx - panStart.x;
        cropPan.y = my - panStart.y;
        drawCropCanvas();
        return;
      }

      if (loadedImage && polyPoints.length > 0 && !isPolyClosed) {
        drawCropCanvas();
        const lastPt = imageToCanvasCoords(polyPoints[polyPoints.length - 1].x, polyPoints[polyPoints.length - 1].y);
        cropCtx.beginPath();
        cropCtx.moveTo(lastPt.x, lastPt.y);
        cropCtx.lineTo(mx, my);
        cropCtx.strokeStyle = '#00d2ff';
        cropCtx.setLineDash([4, 4]);
        cropCtx.lineWidth = 1.5;
        cropCtx.stroke();
        cropCtx.setLineDash([]);
      }
    });

    cropCanvas.addEventListener('mouseup', (e) => {
      if (e.button === 2) isPanning = false;
    });

    cropCanvas.addEventListener('dblclick', () => finishPolygon());

    cropCanvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (!loadedImage) return;

      const rect = cropCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const newZoom = Math.max(0.1, Math.min(20, cropZoom * zoomFactor));

      cropPan.x = mx - (mx - cropPan.x) * (newZoom / cropZoom);
      cropPan.y = my - (my - cropPan.y) * (newZoom / cropZoom);
      cropZoom = newZoom;

      drawCropCanvas();
    });

    function undoCropPoint() {
      if (polyPoints.length > 0 && !isPolyClosed) {
        polyPoints.pop();
        drawCropCanvas();
      }
    }

    function finishPolygon() {
      if (polyPoints.length >= 3) {
        isPolyClosed = true;
        drawCropCanvas();
      }
    }

    function drawCropCanvas() {
      cropCtx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
      if (!loadedImage) return;

      applySmoothing(cropCtx);

      cropCtx.save();
      cropCtx.translate(cropPan.x, cropPan.y);
      cropCtx.scale(cropZoom, cropZoom);
      cropCtx.drawImage(loadedImage, 0, 0);
      cropCtx.restore();

      if (polyPoints.length > 0) {
        cropCtx.beginPath();
        const first = imageToCanvasCoords(polyPoints[0].x, polyPoints[0].y);
        cropCtx.moveTo(first.x, first.y);

        for (let i = 1; i < polyPoints.length; i++) {
          const pt = imageToCanvasCoords(polyPoints[i].x, polyPoints[i].y);
          cropCtx.lineTo(pt.x, pt.y);
        }

        if (isPolyClosed) {
          cropCtx.closePath();
          cropCtx.fillStyle = 'rgba(0, 210, 255, 0.25)';
          cropCtx.fill();
        }

        cropCtx.strokeStyle = '#00d2ff';
        cropCtx.lineWidth = 2;
        cropCtx.stroke();

        polyPoints.forEach((p, idx) => {
          const pt = imageToCanvasCoords(p.x, p.y);
          cropCtx.beginPath();
          cropCtx.arc(pt.x, pt.y, idx === 0 ? 6 : 4, 0, Math.PI * 2);
          cropCtx.fillStyle = idx === 0 ? '#ffcc00' : '#00ff88';
          cropCtx.fill();
        });
      }
    }

    function confirmCrop() {
      if (!loadedImage || polyPoints.length < 3) {
        alert("Crie ao menos 3 pontos de retas conectadas para definir o recorte.");
        return;
      }

      saveState();

      if (!isPolyClosed) finishPolygon();

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      polyPoints.forEach(p => {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      });

      const width = maxX - minX;
      const height = maxY - minY;
      if (width <= 0 || height <= 0) return;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = width;
      offCanvas.height = height;
      const offCtx = offCanvas.getContext('2d');

      applySmoothing(offCtx);

      offCtx.beginPath();
      offCtx.moveTo(polyPoints[0].x - minX, polyPoints[0].y - minY);
      for (let i = 1; i < polyPoints.length; i++) {
        offCtx.lineTo(polyPoints[i].x - minX, polyPoints[i].y - minY);
      }
      offCtx.closePath();
      offCtx.clip();

      offCtx.drawImage(loadedImage, -minX, -minY);

      if (document.getElementById('chk-remove-white').checked) {
        const imgData = offCtx.getImageData(0, 0, width, height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
          if (data[i] > 225 && data[i + 1] > 225 && data[i + 2] > 225) {
            data[i + 3] = 0;
          }
        }
        offCtx.putImageData(imgData, 0, 0);
      }

      const imgCount = unattachedImages.length + 1;
      const newSprite = {
        name: `Img_Solta_${imgCount}`,
        imageCanvas: offCanvas,
        offX: 0,
        offY: 0,
        scale: 1.0,
        rot: 0
      };

      unattachedImages.push(newSprite);

      closeImageModal();
      updateUI();
      render();
    }

    function renderGhostFrames() {
      if (!onionSkinEnabled || currentFrame <= 0) return;

      const startGhostFrame = Math.max(0, currentFrame - onionSkinCount);

      for (let f = startGhostFrame; f < currentFrame; f++) {
        const ghostStates = calculateFrameState(f);
        const distance = currentFrame - f;
        const opacity = Math.max(0.08, 0.35 - (distance - 1) * 0.08);

        const tempTransforms = {};

        bones.forEach(bone => {
          tempTransforms[bone.id] = {
            localAngle: bone.localAngle,
            posX: bone.posX,
            posY: bone.posY,
            length: bone.length,
            startX: bone.startX,
            startY: bone.startY,
            endX: bone.endX,
            worldAngle: bone.worldAngle
          };

          if (ghostStates[bone.id]) {
            bone.localAngle = ghostStates[bone.id].angle;
            bone.posX = ghostStates[bone.id].posX;
            bone.posY = ghostStates[bone.id].posY;
            bone.length = ghostStates[bone.id].length;
          }
        });

        bones.forEach(b => b.updateTransform());

        bones.forEach(bone => {
          if (!bone.attachedSprite || !bone.visibleImage) return;

          const s = bone.attachedSprite;
          ctx.save();
          ctx.globalAlpha = opacity;

          ctx.translate(bone.startX, bone.startY);
          ctx.rotate(bone.worldAngle);
          ctx.translate(s.offX, s.offY);
          ctx.rotate(s.rot);
          ctx.scale(s.scale, s.scale);

          ctx.drawImage(s.imageCanvas, -s.imageCanvas.width / 2, -s.imageCanvas.height / 2);
          ctx.restore();
        });

        bones.forEach(bone => {
          if (!bone.visibleBone) return;

          ctx.save();
          ctx.globalAlpha = opacity;

          ctx.strokeStyle = '#5588aa';
          ctx.lineWidth = 2 / stageZoom;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          bone.meshStrokes.forEach(stroke => {
            ctx.beginPath();
            for (let i = 0; i < stroke.length - 1; i++) {
              const p1 = bone.localToWorld(stroke[i]);
              const p2 = bone.localToWorld(stroke[i + 1]);
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
            }
            ctx.stroke();
          });

          ctx.beginPath();
          ctx.moveTo(bone.startX, bone.startY);
          ctx.lineTo(bone.endX, bone.endY);
          ctx.strokeStyle = '#00aaff';
          ctx.setLineDash([4 / stageZoom, 4 / stageZoom]);
          ctx.lineWidth = 1.5 / stageZoom;
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.beginPath();
          ctx.arc(bone.endX, bone.endY, 4 / stageZoom, 0, Math.PI * 2);
          ctx.fillStyle = '#00aaff';
          ctx.fill();

          ctx.restore();
        });

        bones.forEach(bone => {
          const t = tempTransforms[bone.id];
          if (t) {
            bone.localAngle = t.localAngle;
            bone.posX = t.posX;
            bone.posY = t.posY;
            bone.length = t.length;
            bone.startX = t.startX;
            bone.startY = t.startY;
            bone.endX = t.endX;
            bone.worldAngle = t.worldAngle;
          }
        });
      }
    }

    function render() {
      bones.forEach(b => b.updateTransform());
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      applySmoothing(ctx);

      ctx.save();
      ctx.translate(stagePan.x, stagePan.y);
      ctx.scale(stageZoom, stageZoom);

      renderGhostFrames();

      if (unattachedImages.length > 0) {
        const select = document.getElementById('unattached-select');
        const activeUnattachedIdx = select ? parseInt(select.value) : -1;

        unattachedImages.forEach((imgObj, idx) => {
          ctx.save();
          ctx.globalAlpha = (idx === activeUnattachedIdx) ? 1.0 : unselectedOpacity;
          const centerX = canvas.width / (2 * stageZoom);
          const centerY = canvas.height / (2 * stageZoom);
          ctx.drawImage(imgObj.imageCanvas, centerX - imgObj.imageCanvas.width / 2, centerY - imgObj.imageCanvas.height / 2);

          if (idx === activeUnattachedIdx) {
            ctx.lineWidth = 2 / stageZoom;
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#ffcc00';
            ctx.strokeRect(centerX - imgObj.imageCanvas.width / 2, centerY - imgObj.imageCanvas.height / 2, imgObj.imageCanvas.width, imgObj.imageCanvas.height);
            ctx.setLineDash([]);
          }
          ctx.restore();
        });
      }

      bones.forEach(bone => {
        if (!bone.attachedSprite || !bone.visibleImage) return;

        const s = bone.attachedSprite;
        const isSelectedBone = (bone === selectedBone);

        ctx.save();
        ctx.globalAlpha = isSelectedBone ? 1.0 : unselectedOpacity;

        ctx.translate(bone.startX, bone.startY);
        ctx.rotate(bone.worldAngle);
        ctx.translate(s.offX, s.offY);
        ctx.rotate(s.rot);
        ctx.scale(s.scale, s.scale);

        ctx.drawImage(s.imageCanvas, -s.imageCanvas.width / 2, -s.imageCanvas.height / 2);

        if (isSelectedBone) {
          const w = s.imageCanvas.width;
          const h = s.imageCanvas.height;

          ctx.lineWidth = 2 / (s.scale * stageZoom);
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = '#ffcc00';
          ctx.strokeRect(-w/2, -h/2, w, h);
          ctx.setLineDash([]);

          if (mode === 'POSE' && transformTarget === 'IMAGE') {
            ctx.beginPath();
            ctx.moveTo(0, -h/2);
            ctx.lineTo(0, -h/2 - 25 / (s.scale * stageZoom));
            ctx.strokeStyle = '#00d2ff';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, -h/2 - 25 / (s.scale * stageZoom), 6 / (s.scale * stageZoom), 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc00';
            ctx.fill();
            ctx.stroke();

            const sBox = 10 / (s.scale * stageZoom);
            ctx.beginPath();
            ctx.rect(w/2 - sBox/2, h/2 - sBox/2, sBox, sBox);
            ctx.fillStyle = '#00ff88';
            ctx.fill();
            ctx.stroke();
          }
        }

        ctx.restore();
      });

      bones.forEach(bone => {
        if (!bone.visibleBone) return;

        const isSelected = bone === selectedBone;

        ctx.save();
        ctx.globalAlpha = isSelected ? 1.0 : unselectedOpacity;

        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 4 / stageZoom;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        bone.meshStrokes.forEach(stroke => {
          ctx.beginPath();
          for (let i = 0; i < stroke.length - 1; i++) {
            const p1 = bone.localToWorld(stroke[i]);
            const p2 = bone.localToWorld(stroke[i + 1]);
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
          }
          ctx.stroke();
        });

        ctx.beginPath();
        ctx.moveTo(bone.startX, bone.startY);
        ctx.lineTo(bone.endX, bone.endY);
        ctx.strokeStyle = isSelected ? '#00d2ff' : 'rgba(255,255,255,0.7)';
        ctx.lineWidth = (isSelected ? 3 : 1.5) / stageZoom;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(bone.endX, bone.endY, (isSelected ? 8 : 5) / stageZoom, 0, Math.PI * 2);
        ctx.fillStyle = isSelected ? '#00d2ff' : '#00aaff';
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1 / stageZoom;
        ctx.stroke();

        const midX = (bone.startX + bone.endX) / 2;
        const midY = (bone.startY + bone.endY) / 2;
        const sqSize = (isSelected ? 10 : 8) / stageZoom;

        ctx.beginPath();
        ctx.rect(midX - sqSize/2, midY - sqSize/2, sqSize, sqSize);
        ctx.fillStyle = isSelected ? '#00ff88' : '#00aa55';
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1 / stageZoom;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(bone.startX, bone.startY, (isSelected ? 12 : 9) / stageZoom, 0, Math.PI * 2);
        ctx.setLineDash([4 / stageZoom, 3 / stageZoom]);
        ctx.strokeStyle = isSelected ? '#00d2ff' : '#ffcc00';
        ctx.lineWidth = 2 / stageZoom;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(bone.startX, bone.startY, (isSelected ? 6 : 4) / stageZoom, 0, Math.PI * 2);
        ctx.fillStyle = isSelected ? '#00d2ff' : '#ffcc00';
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1 / stageZoom;
        ctx.stroke();

        ctx.restore();
      });

      ctx.restore();
    }

    resizeCanvas();
    setMode('ADD_BONE_ROOT');
  </script>
</body>
