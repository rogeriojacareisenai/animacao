<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171923">
<title>Mini Paint Tablet + Animação</title>
<style>
:root{
  --bg:#171923; --panel:#232634; --panel2:#11131b; --line:#3a4054;
  --text:#f3f5fb; --muted:#aeb5c7; --accent:#00d2ff; --btn:#303548;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{touch-action:none}
button,input,select{font:inherit}
button{
  min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--btn);
  color:var(--text);padding:6px 10px;cursor:pointer;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
}
button:active{transform:scale(.98)}
button.active{background:var(--accent);color:#071016;border-color:var(--accent);font-weight:800}
input[type=color]{width:42px;height:38px;padding:2px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
input[type=range]{accent-color:var(--accent);min-width:80px}
input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:55px;text-align:center}
select{
  min-height:38px;background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:6px;max-width:220px
}
#app{width:100%;height:100%;display:flex;flex-direction:column}
#topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;
  padding-top:max(6px,env(safe-area-inset-top));background:var(--panel2);
  border-bottom:1px solid var(--line);z-index:20;flex-wrap:wrap
}
.brand{font-weight:900;color:var(--accent);font-size:1.05rem;margin-right:4px}
.group{display:flex;align-items:center;gap:6px}
.label{font-size:.78rem;color:var(--muted)}
.spacer{flex:1}
#status{font-size:.75rem;color:var(--muted);white-space:nowrap}

#workspace{
  position:relative;flex:1;min-height:0;overflow:auto;
  background:#202027;
  background-image:
    linear-gradient(45deg,#303038 25%,transparent 25%),
    linear-gradient(-45deg,#303038 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#303038 75%),
    linear-gradient(-45deg,transparent 75%,#303038 75%);
  background-size:24px 24px;
  background-position:0 0,0 12px,12px -12px,-12px 0;
}
#canvasViewport{
  position:relative;
  min-width:100%;min-height:100%;
  width:100%;height:100%;
  overflow:visible;
  touch-action:none;
}
#paintCanvas{
  display:block;position:absolute;left:0;top:0;
  background:#ffffff;
  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 8px 30px rgba(0,0,0,.25);
  touch-action:none;transform-origin:0 0;
}

/* TIMELINE CONTAINER */
#timelinePanel{
  flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:6px 10px;display:flex;flex-direction:column;gap:6px;z-index:15;
}
.timelineControls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timelineTrack{
  display:flex;gap:4px;overflow-x:auto;padding:4px 0;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.frameCell{
  min-width:32px;height:40px;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer;font-size:0.75rem;position:relative;
}
.frameCell.active{border-color:var(--accent);background:var(--btn);font-weight:bold}
.frameCell.hasKeyframe::after{
  content:"";width:8px;height:8px;background:var(--accent);border-radius:50%;
  position:absolute;bottom:4px;
}

#bottom{
  flex:0 0 auto;background:var(--panel2);border-top:1px solid var(--line);
  padding:6px 10px;padding-bottom:max(6px,env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;flex-wrap:wrap
}
.sliderBox{display:flex;align-items:center;gap:6px}
.value{min-width:42px;text-align:center;color:var(--muted);font-size:.78rem}
.newDrawingGroup{display:flex;align-items:center}
#newDrawing{min-height:38px;max-width:200px}
#message{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(10,12,18,.92);border:1px solid var(--accent);border-radius:12px;
  padding:16px 20px;z-index:30;display:none;text-align:center;max-width:90vw
}
#help{
  position:absolute;right:12px;top:12px;background:rgba(10,12,18,.82);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);
  font-size:.74rem;z-index:10;pointer-events:none
}
@media (max-width:800px){
  #topbar{gap:4px;padding-left:6px;padding-right:6px}
  button{min-height:42px;padding:6px 8px}
  select{max-width:160px}
  #status{display:none}
  .desktopOnly{display:none}
  #help{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">🖌️ Mini Paint Tablet</div>

    <div class="group">
      <select id="brush">
        <optgroup label="Lápis / Esboço">
          <option value="pencil">✏️ Lápis Cartoon</option>
          <option value="pencil-soft">✏️ Grafite macio</option>
          <option value="pencil-hard">✏️ Grafite duro</option>
          <option value="pencil-real">✏️ Lápis sensível</option>
          <option value="mechanical">🖊️ Lapiseira</option>
        </optgroup>
        <optgroup label="Line Art / Tinta">
          <option value="fineliner">🖋️ Caneta técnica</option>
          <option value="ink" selected>🖊️ Nanquim</option>
          <option value="brush-pen">🖌️ Caneta Brush</option>
          <option value="marker">🖍️ Marcador</option>
        </optgroup>
        <optgroup label="Pincéis">
          <option value="hard-brush">● Pincel duro</option>
          <option value="soft-brush">◉ Pincel suave</option>
          <option value="watercolor">💧 Aquarela</option>
          <option value="chalk">▰ Giz</option>
        </optgroup>
      </select>
    </div>

    <button id="eraser">🧽 Borracha</button>
    <button id="picker">💧 Conta-gotas</button>
    <button id="fill">🪣 Balde</button>
    <input id="color" type="color" value="#ff0055" title="Cor">

    <div class="sliderBox">
      <span class="label">Tamanho</span>
      <input id="size" type="range" min="1" max="100" value="12">
      <span id="sizeValue" class="value">12 px</span>
    </div>

    <div class="sliderBox desktopOnly">
      <span class="label">Pressão</span>
      <input id="pressure" type="range" min="0" max="100" value="85">
      <span id="pressureValue" class="value">85%</span>
    </div>

    <div class="spacer"></div>
    <span id="status">Novo desenho</span>
  </div>

  <div id="workspace">
    <div id="canvasViewport">
      <canvas id="paintCanvas"></canvas>
    </div>
    <div id="help">1 dedo/caneta: desenhar • 2 dedos: mover/zoom • roda: zoom</div>
    <div id="message"></div>
  </div>

  <!-- LINHA DO TEMPO / ANIMAÇÃO -->
  <div id="timelinePanel">
    <div class="timelineControls">
      <button id="btnPlay">▶️ Tocar</button>
      <button id="btnPrevFrame">⏮️</button>
      <button id="btnNextFrame">⏭️</button>
      
      <div class="group">
        <button id="btnAddKeyframe">➕ Keyframe</button>
        <button id="btnRemoveKeyframe">➖ Keyframe</button>
      </div>

      <div class="sliderBox">
        <label><input type="checkbox" id="chkOnion" checked> Onion Skin</label>
        <span class="label">Ant:</span>
        <input type="number" id="onionPrev" value="1" min="0" max="5">
        <span class="label">Post:</span>
        <input type="number" id="onionNext" value="1" min="0" max="5">
      </div>

      <div class="sliderBox">
        <span class="label">FPS:</span>
        <input type="number" id="animFPS" value="12" min="1" max="60">
        <span class="label">Frames:</span>
        <input type="number" id="totalFramesInput" value="24" min="1" max="100">
      </div>
    </div>

    <div class="timelineTrack" id="timelineTrack">
      <!-- Células geradas via Javascript -->
    </div>
  </div>

  <div id="bottom">
    <button id="undo">↶ Desfazer</button>
    <button id="redo">↷ Refazer</button>
    <button id="clear">🗑️ Limpar</button>
    <button id="original">↺ Restaurar</button>
    <div class="newDrawingGroup">
      <select id="newDrawing" title="Escolher novo desenho">
        <option value="">＋ Novo desenho...</option>
        <optgroup label="Formatos comuns">
          <option value="square">Quadrado — 1200 × 1200</option>
          <option value="landscape">Paisagem — 1600 × 1000</option>
          <option value="portrait">Retrato — 1000 × 1400</option>
          <option value="hd">HD 16:9 — 1600 × 900</option>
          <option value="fullhd">Full HD 16:9 — 1920 × 1080</option>
          <option value="4k">4K 16:9 — 3840 × 2160</option>
        </optgroup>
      </select>
    </div>
    <button id="save">💾 Salvar</button>
    <button id="load">📂 Carregar</button>
    <button id="export">⬇️ PNG</button>
    <input id="file" type="file" accept="image/*" hidden>

    <div class="spacer"></div>
    <button id="zoomOut">−</button>
    <span id="zoomValue" class="value">100%</span>
    <button id="zoomIn">＋</button>
    <button id="zoomReset">🔍 100%</button>
  </div>
</div>

<script>
"use strict";

const canvas = document.getElementById("paintCanvas");
const ctx = canvas.getContext("2d", {willReadFrequently:true});
const viewport = document.getElementById("canvasViewport");

let tool = "ink";
let drawing = false;
let last = null;
let start = null;
let pointerId = null;
let pointerType = "touch";
let pressureValue = .5;
let zoom = 1;

const MIN_ZOOM = .05, MAX_ZOOM = 4;
let undoStack = [], redoStack = [];
let originalData = null;

const pointers = new Map();
let gestureStart = null;

/* ESTRUTURA DE ANIMAÇÃO */
let currentFrame = 1;
let totalFrames = 24;
let keyframes = new Map(); // Guarda ImageData por índice de frame (1-based)
let isPlaying = false;
let playInterval = null;

function smoothing(c){
  c.imageSmoothingEnabled = true;
  c.imageSmoothingQuality = "high";
}
smoothing(ctx);

function setCanvasSize(w, h, copy = true){
  w = Math.max(1, Math.floor(w)); h = Math.max(1, Math.floor(h));
  let old = null;
  if(copy && canvas.width && canvas.height){
    old = document.createElement("canvas");
    old.width = canvas.width; old.height = canvas.height;
    old.getContext("2d").drawImage(canvas, 0, 0);
  }
  canvas.width = w; canvas.height = h;
  smoothing(ctx);
  if(old) ctx.drawImage(old, 0, 0);
  originalData = snapshot();
  undoStack = []; redoStack = [];
  fitCanvas();
  updateStatus();
}

function snapshot(){
  return canvas.width && canvas.height ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
}
function pushUndo(){
  const s = snapshot();
  if(!s) return;
  undoStack.push(s);
  if(undoStack.length > 40) undoStack.shift();
  redoStack = [];
}
function restore(s){
  if(!s) return;
  ctx.putImageData(s, 0, 0);
  updateStatus();
}
function undo(){
  if(!undoStack.length) return;
  const cur = snapshot();
  if(cur) redoStack.push(cur);
  restore(undoStack.pop());
}
function redo(){
  if(!redoStack.length) return;
  const cur = snapshot();
  if(cur) undoStack.push(cur);
  restore(redoStack.pop());
}

function showMessage(text){
  const el = document.getElementById("message");
  el.textContent = text; el.style.display = "block";
  clearTimeout(showMessage.timer);
  showMessage.timer = setTimeout(() => el.style.display = "none", 1500);
}

function updateStatus(){
  const names = {
    pencil:"Lápis Cartoon", "pencil-soft":"Grafite macio", "pencil-hard":"Grafite duro",
    "pencil-real":"Lápis sensível", mechanical:"Lapiseira", fineliner:"Caneta técnica",
    ink:"Nanquim", "brush-pen":"Caneta Brush", marker:"Marcador",
    "hard-brush":"Pincel duro", "soft-brush":"Pincel suave",
    watercolor:"Aquarela", chalk:"Giz", eraser:"Borracha", picker:"Conta-gotas", fill:"Balde"
  };
  document.getElementById("status").textContent =
    `${canvas.width} × ${canvas.height}px • ${names[tool]||tool} • ${Math.round(zoom*100)}%`;
}

function setTool(t){
  tool = t;
  document.getElementById("brush").value =
    ["eraser", "picker", "fill"].includes(t) ? "ink" : t;
  ["eraser", "picker", "fill"].forEach(id => {
    document.getElementById(id).classList.toggle("active", id === t);
  });
  canvas.style.cursor = t === "picker" ? "copy" : t === "fill" ? "cell" : "crosshair";
  updateStatus();
}

function color(){ return document.getElementById("color").value || "#ff0055"; }
function size(){ return Math.max(1, Number(document.getElementById("size").value) || 12); }
function pressureFactor(){
  const influence = Number(document.getElementById("pressure").value) / 100;
  return 1 - influence + pressureValue * influence;
}

function settings(){
  const base = size(), f = pressureFactor();
  switch(tool){
    case "pencil-soft": return {size:base*(.38+f), alpha:.14+f*.48, blur:Math.max(.45, base*.075)};
    case "pencil-hard": return {size:base*(.34+f*.78), alpha:.38+f*.56, blur:0};
    case "pencil-real": return {size:base*(.18+f*1.10), alpha:.08+f*.86, blur:Math.max(0, base*.018)};
    case "mechanical": return {size:base*(.22+f*.55), alpha:.72+f*.28, blur:0};
    case "fineliner": return {size:base*(.28+f*.34), alpha:.82+f*.18, blur:0};
    case "ink": return {size:base*(.18+f*1.02), alpha:.78+f*.22, blur:0};
    case "brush-pen": return {size:base*(.20+f*1.45), alpha:.62+f*.38, blur:0};
    case "marker": return {size:base*(.72+f*.70), alpha:.20+f*.34, blur:.2};
    case "hard-brush": return {size:base*(.40+f), alpha:.72+f*.28, blur:0};
    case "soft-brush": return {size:base*(.65+f*.90), alpha:.10+f*.48, blur:Math.max(1, base*.16)};
    case "watercolor": return {size:base*(.75+f*.85), alpha:.06+f*.24, blur:Math.max(.7, base*.10)};
    case "chalk": return {size:base*(.55+f*.95), alpha:.22+f*.42, blur:.35};
    default: return {size:base*(.28+f*.92), alpha:.30+f*.62, blur:Math.max(0, base*.012)};
  }
}

function drawSegment(a, b){
  const s = tool === "eraser" ? {size:size(), alpha:1, blur:0} : settings();
  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = s.size;
  if(tool === "eraser"){
    ctx.globalCompositeOperation = "destination-out";
    ctx.strokeStyle = "rgba(0,0,0,1)";
  }else{
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = color();
    ctx.globalAlpha = s.alpha;
    if(s.blur > 0) ctx.filter = `blur(${s.blur}px)`;
  }
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.restore();
}

function point(e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}
function updatePressure(e){
  pressureValue = Number.isFinite(e.pressure) && e.pressure > 0 ? e.pressure : .5;
  pointerType = e.pointerType || "mouse";
}

function hexRGBA(hex){
  const h = String(hex).replace("#", "");
  const v = h.length === 3 ? h.split("").map(x => x + x).join("") : h.padEnd(6, "0").slice(0, 6);
  return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16), 255];
}

function floodFill(sx, sy){
  const w = canvas.width, h = canvas.height;
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  const start = (sy * w + sx) * 4;
  const sr = d[start], sg = d[start+1], sb = d[start+2], sa = d[start+3];
  const [tr, tg, tb, ta] = hexRGBA(color());
  const tolerance = 18 * 2.55;

  const matches = i => {
    const dr = d[i] - sr, dg = d[i+1] - sg, db = d[i+2] - sb, da = d[i+3] - sa;
    return Math.sqrt((dr*dr + dg*dg + db*db + da*da) / 4) <= tolerance;
  };
  if(sr === tr && sg === tg && sb === tb && sa === ta) return;

  const visited = new Uint8Array(w * h);
  const stack = [sx + sy * w];
  visited[sx + sy * w] = 1;

  while(stack.length){
    const pos = stack.pop(), x = pos % w, y = Math.floor(pos / w), i = pos * 4;
    if(!matches(i)) continue;
    d[i] = tr; d[i+1] = tg; d[i+2] = tb; d[i+3] = ta;
    if(x > 0){ let n = pos - 1; if(!visited[n]){ visited[n] = 1; stack.push(n); } }
    if(x < w - 1){ let n = pos + 1; if(!visited[n]){ visited[n] = 1; stack.push(n); } }
    if(y > 0){ let n = pos - w; if(!visited[n]){ visited[n] = 1; stack.push(n); } }
    if(y < h - 1){ let n = pos + w; if(!visited[n]){ visited[n] = 1; stack.push(n); } }
  }
  ctx.putImageData(img, 0, 0);
}

function pointerDown(e){
  if(isPlaying) return;
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if(pointers.size > 1){
    drawing = false;
    startGesture();
    return;
  }
  if(e.pointerType === "mouse" && e.button !== 0) return;
  e.preventDefault();
  updatePressure(e);
  const p = point(e);
  const x = Math.max(0, Math.min(canvas.width - 1, Math.floor(p.x)));
  const y = Math.max(0, Math.min(canvas.height - 1, Math.floor(p.y)));

  if(tool === "picker"){
    const px = ctx.getImageData(x, y, 1, 1).data;
    if(px[3] > 0){
      document.getElementById("color").value = "#" + [px[0], px[1], px[2]]
        .map(v => v.toString(16).padStart(2, "0")).join("");
      setTool("pencil");
    }
    return;
  }
  if(tool === "fill"){
    pushUndo(); floodFill(x, y); autoSaveKeyframe(); updateStatus(); return;
  }

  pushUndo();
  drawing = true; last = p; start = p; pointerId = e.pointerId;
  canvas.setPointerCapture?.(e.pointerId);
}

function pointerMove(e){
  if(pointers.has(e.pointerId))
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});

  if(pointers.size > 1){
    if(!gestureStart) startGesture();
    updateGesture();
    return;
  }
  if(!drawing) return;
  e.preventDefault();
  updatePressure(e);
  const p = point(e);
  if(e.shiftKey && start){
    const base = undoStack[undoStack.length - 1];
    if(base) ctx.putImageData(base, 0, 0);
    drawSegment(start, p);
  }else if(last){
    drawSegment(last, p);
  }
  last = p;
}

function pointerUp(e){
  pointers.delete(e.pointerId);
  if(pointers.size === 0){
    if(drawing){
      drawing = false;
      autoSaveKeyframe();
    }
    last = null; start = null; pointerId = null;
    try{ canvas.releasePointerCapture?.(e.pointerId); }catch(_){}
  }else if(pointers.size === 1){
    gestureStart = null;
  }
}

canvas.addEventListener("pointerdown", pointerDown);
canvas.addEventListener("pointermove", pointerMove);
canvas.addEventListener("pointerup", pointerUp);
canvas.addEventListener("pointercancel", pointerUp);

function distance(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function midpoint(a, b){ return {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2}; }

function startGesture(){
  const ps = [...pointers.values()];
  if(ps.length < 2) return;
  const a = ps[0], b = ps[1], m = midpoint(a, b);
  gestureStart = {dist: distance(a, b), mid: m, zoom, tx: currentTX, ty: currentTY};
}

function updateGesture(){
  const ps = [...pointers.values()];
  if(ps.length < 2 || !gestureStart) return;
  const a = ps[0], b = ps[1];
  const dist = distance(a, b);
  if(gestureStart.dist > 0){
    const factor = dist / gestureStart.dist;
    setZoom(gestureStart.zoom * factor);
  }
}

let currentTX = 0, currentTY = 0;

function updateViewportSize(){
  const workspace = viewport.parentElement;
  const w = workspace.clientWidth;
  const h = workspace.clientHeight;
  const scaledW = Math.max(1, canvas.width * zoom);
  const scaledH = Math.max(1, canvas.height * zoom);

  const marginX = Math.max(40, (w - scaledW) / 2);
  const marginY = Math.max(40, (h - scaledH) / 2);

  viewport.style.width = Math.max(w, scaledW + marginX * 2) + "px";
  viewport.style.height = Math.max(h, scaledH + marginY * 2) + "px";

  return {w, h, scaledW, scaledH};
}

function updateTransform(){
  const metrics = updateViewportSize();
  if(metrics.scaledW <= metrics.w){ currentTX = (metrics.w - metrics.scaledW) / 2; }
  if(metrics.scaledH <= metrics.h){ currentTY = (metrics.h - metrics.scaledH) / 2; }

  canvas.style.transform = `translate(${currentTX}px,${currentTY}px) scale(${zoom})`;
  document.getElementById("zoomValue").textContent = Math.round(zoom * 100) + "%";
  updateStatus();
}

function setZoom(newZoom){
  zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
  updateTransform();
}

function fitCanvas(){
  const workspace = viewport.parentElement;
  const w = workspace.clientWidth;
  const h = workspace.clientHeight;

  const zx = (w * .88) / Math.max(1, canvas.width);
  const zy = (h * .82) / Math.max(1, canvas.height);

  zoom = Math.max(MIN_ZOOM, Math.min(1, Math.min(zx, zy)));
  currentTX = 0; currentTY = 0;
  updateTransform();

  workspace.scrollLeft = 0;
  workspace.scrollTop = 0;
}

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
}, {passive: false});

/* LÓGICA DA LINHA DO TEMPO E ONION SKIN */

function renderTimeline(){
  const track = document.getElementById("timelineTrack");
  track.innerHTML = "";
  for(let i = 1; i <= totalFrames; i++){
    const cell = document.createElement("div");
    cell.className = "frameCell" + (i === currentFrame ? " active" : "") + (keyframes.has(i) ? " hasKeyframe" : "");
    cell.textContent = i;
    cell.onclick = () => gotoFrame(i);
    track.appendChild(cell);
  }
}

function autoSaveKeyframe(){
  keyframes.set(currentFrame, snapshot());
  renderTimeline();
}

function setKeyframe(){
  keyframes.set(currentFrame, snapshot());
  renderTimeline();
  showMessage(`Keyframe salvo no quadro ${currentFrame}`);
}

function removeKeyframe(){
  if(keyframes.has(currentFrame)){
    keyframes.delete(currentFrame);
    renderTimeline();
    renderFrame();
    showMessage(`Keyframe removido do quadro ${currentFrame}`);
  }
}

function renderFrame(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Renderizar Onion Skin se ativo e se não estiver reproduzindo
  const useOnion = document.getElementById("chkOnion").checked && !isPlaying;
  if(useOnion){
    const prevCount = Math.max(0, parseInt(document.getElementById("onionPrev").value) || 0);
    const nextCount = Math.max(0, parseInt(document.getElementById("onionNext").value) || 0);

    // Quadros Anteriores (Vermelho/Rosa)
    for(let i = prevCount; i >= 1; i--){
      const f = currentFrame - i;
      if(keyframes.has(f)){
        drawOnionLayer(keyframes.get(f), "rgba(255, 0, 80, ", 0.25 / i);
      }
    }

    // Quadros Posteriores (Azul/Verde)
    for(let i = 1; i <= nextCount; i++){
      const f = currentFrame + i;
      if(keyframes.has(f)){
        drawOnionLayer(keyframes.get(f), "rgba(0, 200, 255, ", 0.25 / i);
      }
    }
  }

  // Desenhar Quadro Atual (se houver keyframe)
  if(keyframes.has(currentFrame)){
    ctx.putImageData(keyframes.get(currentFrame), 0, 0);
  } else {
    // Se não for um keyframe, mantém fundo branco base
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  undoStack = []; redoStack = [];
}

function drawOnionLayer(imgData, colorPrefix, alpha){
  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
  const tCtx = tempCanvas.getContext("2d");
  tCtx.putImageData(imgData, 0, 0);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(tempCanvas, 0, 0);
  ctx.restore();
}

function gotoFrame(f){
  if(f < 1) f = totalFrames;
  if(f > totalFrames) f = 1;
  currentFrame = f;
  renderTimeline();
  renderFrame();
}

function togglePlay(){
  isPlaying = !isPlaying;
  const btn = document.getElementById("btnPlay");
  if(isPlaying){
    btn.textContent = "⏸️ Pausar";
    const fps = Math.max(1, parseInt(document.getElementById("animFPS").value) || 12);
    playInterval = setInterval(() => {
      gotoFrame(currentFrame + 1);
    }, 1000 / fps);
  } else {
    btn.textContent = "▶️ Tocar";
    clearInterval(playInterval);
    renderFrame();
  }
}

/* EVENTOS DE BARRA E CONTROLES */

document.getElementById("btnPlay").onclick = togglePlay;
document.getElementById("btnPrevFrame").onclick = () => gotoFrame(currentFrame - 1);
document.getElementById("btnNextFrame").onclick = () => gotoFrame(currentFrame + 1);
document.getElementById("btnAddKeyframe").onclick = setKeyframe;
document.getElementById("btnRemoveKeyframe").onclick = removeKeyframe;

document.getElementById("chkOnion").onchange = renderFrame;
document.getElementById("onionPrev").onchange = renderFrame;
document.getElementById("onionNext").onchange = renderFrame;

document.getElementById("totalFramesInput").onchange = (e) => {
  totalFrames = Math.max(1, parseInt(e.target.value) || 1);
  if(currentFrame > totalFrames) currentFrame = totalFrames;
  renderTimeline();
};

document.getElementById("brush").onchange = e => setTool(e.target.value);
document.getElementById("eraser").onclick = () => setTool("eraser");
document.getElementById("picker").onclick = () => setTool("picker");
document.getElementById("fill").onclick = () => setTool("fill");

document.getElementById("size").oninput = e => {
  document.getElementById("sizeValue").textContent = e.target.value + " px";
};
document.getElementById("pressure").oninput = e => {
  document.getElementById("pressureValue").textContent = e.target.value + "%";
};

document.getElementById("undo").onclick = undo;
document.getElementById("redo").onclick = redo;
document.getElementById("clear").onclick = () => {
  pushUndo(); ctx.clearRect(0, 0, canvas.width, canvas.height); autoSaveKeyframe(); updateStatus();
};
document.getElementById("original").onclick = () => {
  if(!originalData) return; pushUndo(); restore(originalData); autoSaveKeyframe();
};

document.getElementById("zoomOut").onclick = () => setZoom(zoom / 1.25);
document.getElementById("zoomIn").onclick = () => setZoom(zoom * 1.25);
document.getElementById("zoomReset").onclick = () => setZoom(1);

document.getElementById("newDrawing").onchange = e => {
  const type = e.target.value;
  if(!type) return;

  let w = 1600, h = 1000;
  if(type === "square"){ w = 1200; h = 1200; }
  else if(type === "landscape"){ w = 1600; h = 1000; }
  else if(type === "portrait"){ w = 1000; h = 1400; }
  else if(type === "hd"){ w = 1600; h = 900; }
  else if(type === "fullhd"){ w = 1920; h = 1080; }
  else if(type === "4k"){ w = 3840; h = 2160; }

  keyframes.clear();
  setCanvasSize(w, h, false);
  ctx.save();
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);
  ctx.restore();

  originalData = snapshot();
  autoSaveKeyframe();

  setTool("ink");
  document.getElementById("color").value = "#0066ff";
  document.getElementById("size").value = 12;
  document.getElementById("sizeValue").textContent = "12 px";

  fitCanvas();
  e.target.value = "";
  showMessage("Novo documento criado");
};

document.getElementById("save").onclick = () => {
  localStorage.setItem("miniPaintTablet", JSON.stringify({
    width: canvas.width, height: canvas.height, data: canvas.toDataURL("image/png")
  }));
  showMessage("Desenho salvo no tablet");
};

document.getElementById("load").onclick = () => {
  const raw = localStorage.getItem("miniPaintTablet");
  if(!raw){ showMessage("Nenhum desenho salvo"); return; }
  const obj = JSON.parse(raw), img = new Image();
  img.onload = () => {
    keyframes.clear();
    setCanvasSize(obj.width, obj.height, false);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0); 
    originalData = snapshot(); 
    autoSaveKeyframe();
    fitCanvas();
    showMessage("Desenho carregado");
  };
  img.src = obj.data;
};

document.getElementById("export").onclick = () => {
  canvas.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "animacao-frame.png"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
};

window.addEventListener("keydown", e => {
  if(e.ctrlKey && e.key.toLowerCase() === "z"){ e.preventDefault(); undo(); }
  else if(e.ctrlKey && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))){ e.preventDefault(); redo(); }
  else if(e.key === "e" || e.key === "E") setTool("eraser");
});

window.addEventListener("resize", () => {
  if(pointers.size === 0) fitCanvas();
  else updateTransform();
});

// Inicialização
setCanvasSize(1600, 1000, false);
ctx.fillStyle = "#ffffff";
ctx.fillRect(0, 0, canvas.width, canvas.height);
document.getElementById("color").value = "#0066ff";
document.getElementById("size").value = 12;
document.getElementById("sizeValue").textContent = "12 px";
setTool("ink");
originalData = snapshot();
autoSaveKeyframe();
renderTimeline();
fitCanvas();
</script>
