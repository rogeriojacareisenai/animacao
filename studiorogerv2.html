<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171923">
<title>Mini Paint Tablet + Animação</title>
<!-- JSZip para exportar arquivos em ZIP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* TEMAS DE LAYOUT PREDEFINIDOS (12 OPÇÕES) */
:root, [data-theme="dark"] {
  --bg:#171923; --panel:#232634; --panel2:#11131b; --line:#3a4054;
  --text:#f3f5fb; --muted:#aeb5c7; --accent:#00d2ff; --btn:#303548;
}
[data-theme="light"] {
  --bg:#e2e8f0; --panel:#ffffff; --panel2:#f1f5f9; --line:#cbd5e1;
  --text:#0f172a; --muted:#64748b; --accent:#2563eb; --btn:#e2e8f0;
}
[data-theme="cyberpunk"] {
  --bg:#0d0221; --panel:#0f051d; --panel2:#05010d; --line:#ff007f;
  --text:#00f6ff; --muted:#b500ff; --accent:#ff007f; --btn:#1d003b;
}
[data-theme="nordic"] {
  --bg:#2e3440; --panel:#3b4252; --panel2:#434c5e; --line:#4c566a;
  --text:#eceff4; --muted:#d8dee9; --accent:#88c0d0; --btn:#4c566a;
}
[data-theme="forest"] {
  --bg:#1a231d; --panel:#243028; --panel2:#131a15; --line:#3a4e40;
  --text:#e8f0ea; --muted:#94b09b; --accent:#52b788; --btn:#2d3e33;
}
[data-theme="sunset"] {
  --bg:#2b1e2a; --panel:#3a2838; --panel2:#20151f; --line:#5e3a5a;
  --text:#fff0f5; --muted:#d8a7ca; --accent:#ff7b54; --btn:#4a3248;
}
[data-theme="dracula"] {
  --bg:#282a36; --panel:#44475a; --panel2:#1e1f29; --line:#6272a4;
  --text:#f8f8f2; --muted:#94a3b8; --accent:#bd93f9; --btn:#44475a;
}
[data-theme="solarized"] {
  --bg:#fdf6e3; --panel:#eee8d5; --panel2:#e0da2e; --line:#93a1a1;
  --text:#073642; --muted:#657b83; --accent:#b58900; --btn:#eee8d5;
}
[data-theme="neongreen"] {
  --bg:#051408; --panel:#0b2910; --panel2:#020a04; --line:#155220;
  --text:#e6ffe8; --muted:#48a257; --accent:#00ff38; --btn:#0f3816;
}
[data-theme="monochrome"] {
  --bg:#121212; --panel:#1e1e1e; --panel2:#000000; --line:#333333;
  --text:#ffffff; --muted:#888888; --accent:#ffffff; --btn:#2a2a2a;
}
[data-theme="pastel"] {
  --bg:#fbf0f5; --panel:#f3d7e5; --panel2:#ead0dd; --line:#d8a3be;
  --text:#4a2e39; --muted:#8c6577; --accent:#d9658b; --btn:#f3d7e5;
}
[data-theme="midnight"] {
  --bg:#0f172a; --panel:#1e293b; --panel2:#0a0f1d; --line:#334155;
  --text:#f8fafc; --muted:#94a3b8; --accent:#38bdf8; --btn:#1e293b;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}
body{touch-action:none}
button,input,select{font:inherit}
button{
  min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--btn);
  color:var(--text);padding:6px 10px;cursor:pointer;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:background .2s,border .2s;
}
button:active{transform:scale(.98)}
button.active{background:var(--accent);color:#071016;border-color:var(--accent);font-weight:800}
input[type=color]{width:100%;height:38px;padding:2px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:55px;text-align:center}
select{
  min-height:38px;background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:6px;width:100%
}
#app{width:100%;height:100%;display:flex;flex-direction:column}

/* BARRA FLUTUANTE / MENU SUSPENSO VERTICAL */
#topbar{
  position: absolute;
  top: 15px;
  left: 15px;
  display: flex;
  flex-direction: column;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 12px;
  z-index: 40;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  backdrop-filter: blur(6px);
  width: 240px;
}

.topbar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--panel);
  border-top-left-radius: 11px;
  border-top-right-radius: 11px;
  border-bottom: 1px solid var(--line);
  cursor: move;
  user-select: none;
}

.topbar-content {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  padding: 12px;
}

#topbar.minimized .topbar-content {
  display: none;
}

.topbar-actions {
  display: flex;
  gap: 4px;
}

.window-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.9rem;
  padding: 2px 6px;
  min-height: auto;
  border-radius: 4px;
}
.window-btn:hover {
  background: var(--line);
  color: var(--text);
}

.brand{font-weight:900;color:var(--accent);font-size:1.05rem;margin-right:4px}
.group{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%}
.label{font-size:.78rem;color:var(--muted)}
.spacer{display:none}
#status{font-size:.75rem;color:var(--muted);text-align:center;margin-top:4px}

#workspace{
  position:relative;flex:1;min-height:0;overflow:auto;
  background:var(--bg);
  background-image:
    linear-gradient(45deg,var(--panel2) 25%,transparent 25%),
    linear-gradient(-45deg,var(--panel2) 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,var(--panel2) 75%),
    linear-gradient(-45deg,transparent 75%,var(--panel2) 75%);
  background-size:24px 24px;
  background-position:0 0,0 12px,12px -12px,-12px 0;
}
#canvasViewport{
  position:relative;
  min-width:100%;min-height:100%;
  width:100%;height:100%;
  overflow:visible;
  touch-action:none;
}

#canvasWrapper {
  position: absolute;
  left: 0; top: 0;
  box-shadow: 0 0 0 1px rgba(0,0,0,.15), 0 12px 35px rgba(0,0,0,.35);
  transform-origin: 0 0;
  border-radius: 18px;
  overflow: hidden;
  background: #ffffff;
  display: flex;
  flex-direction: column;
}

#paintCanvas{
  display:block;
  touch-action:none;
}

.disneyPegBar {
  height: 48px;
  width: 100%;
  background: #f8f9fa;
  border-top: 1px solid #e0e0e0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 36px;
  flex-shrink: 0;
  pointer-events: none;
}
.pegHole {
  background: #171923;
  box-shadow: inset 1px 1px 2px rgba(0,0,0,0.6);
}
.pegHole.circle {
  width: 14px;
  height: 14px;
  border-radius: 50%;
}
.pegHole.rect {
  width: 32px;
  height: 12px;
  border-radius: 3px;
}

#timelinePanel{
  flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:6px 10px;display:flex;flex-direction:column;gap:6px;z-index:15;
}
.timelineControls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.timelineDivider{
  width:100%;
  height:1px;
  background-color:var(--line);
  margin:2px 0;
}

.timelineTrackContainer{
  position:relative;
  width:100%;
  display:flex;
  flex-direction:column;
}

.timelineTrack{
  display:flex;gap:4px;overflow-x:auto;padding:8px 0;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  cursor:ew-resize;
  position:relative;
}

.frameCell{
  min-width:32px;height:44px;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;cursor:pointer;font-size:0.75rem;position:relative;
  padding-bottom:4px;overflow:hidden;flex-shrink:0;transition:all 0.15s ease;
}
.frameCell.active{border-color:var(--accent);background:var(--btn);font-weight:bold}

.frameCell::before{
  content:"";
  width:100%;
  height:8px;
  background:var(--line);
}
.frameCell.hasKeyframe::before{
  background:var(--accent);
}

.frameCell.onion-prev {
  border-left: 3px solid #ff4757 !important;
  background: rgba(255, 71, 87, 0.18) !important;
}
.frameCell.onion-next {
  border-right: 3px solid #2ed573 !important;
  background: rgba(46, 213, 115, 0.18) !important;
}

#themePreviewModal {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center;
  z-index: 100; backdrop-filter: blur(4px);
}
.modalContent {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 20px; width: 90%; max-width: 650px; max-height: 85vh; overflow-y: auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
.themeGrid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 15px;
}
.themeCard {
  border: 2px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer;
  background: var(--panel2); text-align: center; transition: transform 0.2s, border-color 0.2s;
}
.themeCard:hover { transform: translateY(-3px); border-color: var(--accent); }
.themePreviewBox {
  height: 40px; border-radius: 6px; margin-bottom: 8px; display: flex; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
}
.themeColorSample { flex: 1; height: 100%; }

#bottom{
  flex:0 0 auto;background:var(--panel2);border-top:1px solid var(--line);
  padding:6px 10px;padding-bottom:max(6px,env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;flex-wrap:wrap
}
.sliderBox{display:flex;flex-direction:column;gap:4px;width:100%}
.value{text-align:right;color:var(--muted);font-size:.78rem}
.newDrawingGroup{display:flex;align-items:center;width:100%}
#newDrawing{min-height:38px;width:100%}
#message{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--panel2);border:1px solid var(--accent);border-radius:12px;
  padding:16px 20px;z-index:30;display:none;text-align:center;max-width:90vw;color:var(--text);
}
#help{
  position:absolute;right:12px;top:12px;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);
  font-size:.74rem;z-index:10;pointer-events:none
}
@media (max-width:800px){
  button{min-height:42px;padding:6px 8px}
  #status{display:none}
  .desktopOnly{display:none}
  #help{display:none}
}
</style>
</head>
<body>
<div id="app">
  <!-- MENU PRINCIPAL FLUTUANTE VERTICAL -->
  <div id="topbar">
    <div class="topbar-header" id="topbarHeader">
      <div class="brand">🖌️ Mini Paint Tablet</div>
      <div class="topbar-actions">
        <button class="window-btn" id="btnMinimize" title="Minimizar/Expandir">🗕</button>
      </div>
    </div>
    <div class="topbar-content">
      <div class="group">
        <select id="brush">
          <optgroup label="Lápis / Esboço">
            <option value="pencil">✏️ Lápis Cartoon</option>
            <option value="pencil-soft">✏️ Grafite macio</option>
            <option value="pencil-hard">✏️ Grafite duro</option>
            <option value="pencil-real">✏️ Lápis sensível</option>
            <option value="mechanical">🖊️ Lapiseira</option>
          </optgroup>
          <optgroup label="Line Art / Tinta">
            <option value="fineliner">🖋️ Caneta técnica</option>
            <option value="ink" selected>🖊️ Nanquim</option>
            <option value="brush-pen">🖌️ Caneta Brush</option>
            <option value="marker">🖍️ Marcador</option>
          </optgroup>
          <optgroup label="Pincéis">
            <option value="hard-brush">● Pincel duro</option>
            <option value="soft-brush">◉ Pincel suave</option>
            <option value="watercolor">💧 Aquarela</option>
            <option value="chalk">▰ Giz</option>
          </optgroup>
        </select>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:4px;">
        <button id="eraser" style="width:100%" title="Borracha">🧽</button>
        <button id="picker" style="width:100%" title="Conta-gotas">💧</button>
        <button id="fill" style="width:100%" title="Balde de tinta">🪣</button>
      </div>
      
      <!-- BOTÕES DE SELEÇÃO RETANGULAR PONTILHADA, COPIAR E COLAR -->
      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:4px;">
        <button id="select" title="Seleção Retangular Pontilhada">⌖</button>
        <button id="copySelection" title="Copiar área selecionada">📋</button>
        <button id="pasteSelection" title="Colar área copiada">📥</button>
      </div>
      
      <input id="color" type="color" value="#ff0055" title="Cor">

      <div class="sliderBox">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="label">Tamanho</span>
          <span id="sizeValue" class="value">12 px</span>
        </div>
        <input id="size" type="range" min="1" max="100" value="12">
      </div>

      <div class="sliderBox desktopOnly">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="label">Pressão</span>
          <span id="pressureValue" class="value">85%</span>
        </div>
        <input id="pressure" type="range" min="0" max="100" value="85">
      </div>

      <!-- SELETOR E PRÉ-VISUALIZADOR DE TEMAS (12 TEMAS) -->
      <div class="group">
        <span class="label">Tema:</span>
        <select id="themeSelect">
          <option value="dark">🌙 Dark Classic</option>
          <option value="light">☀️ Light Clean</option>
          <option value="cyberpunk">👾 Cyberpunk Neon</option>
          <option value="nordic">❄️ Nordic Slate</option>
          <option value="forest">🌲 Forest Organic</option>
          <option value="sunset">🌅 Sunset Pastel</option>
          <option value="dracula">🧛 Dracula Gothic</option>
          <option value="solarized">🌾 Solarized Light</option>
          <option value="neongreen">⚡ Cyber Neon Green</option>
          <option value="monochrome">🏁 Monochrome Ink</option>
          <option value="pastel">🌸 Pastel Dream</option>
          <option value="midnight">🌌 Midnight Blue</option>
        </select>
        <button id="btnPreviewThemes" title="Visualizar opções de temas">🖼️ Opções</button>
      </div>

      <span id="status">Novo desenho</span>
    </div>
  </div>

  <div id="workspace">
    <div id="canvasViewport">
      <!-- CONTAINER DA FOLHA ESTILO ANIMAÇÃO DISNEY COM PERFURAÇÕES -->
      <div id="canvasWrapper">
        <canvas id="paintCanvas"></canvas>
        <div class="disneyPegBar">
          <div class="pegHole circle"></div>
          <div class="pegHole rect"></div>
          <div class="pegHole circle"></div>
        </div>
      </div>
    </div>
    <div id="help">1 dedo/caneta: desenhar • 2 dedos: mover/zoom • roda: zoom</div>
    <div id="message"></div>
  </div>

  <!-- LINHA DO TEMPO / ANIMAÇÃO -->
  <div id="timelinePanel">
    <div class="timelineControls">
      <button id="btnPlay">▶️ Tocar</button>
      <button id="btnPrevFrame">⏮️</button>
      <button id="btnNextFrame">⏭️</button>
      
      <div class="group" style="flex-direction:row; width:auto;">
        <button id="btnAddKeyframe">➕ Keyframe</button>
        <button id="btnRemoveKeyframe">➖ Keyframe</button>
      </div>

      <div class="sliderBox" style="width:auto; flex-direction:row; align-items:center;">
        <label><input type="checkbox" id="chkOnion" checked> Onion Skin</label>
        <span class="label">Ant:</span>
        <input type="number" id="onionPrev" value="1" min="0" max="5">
        <span class="label">Post:</span>
        <input type="number" id="onionNext" value="1" min="0" max="5">
        <span class="label">Opacidade:</span>
        <input id="onionOpacity" type="range" min="0" max="100" value="30" style="width:80px;">
        <span id="onionOpacityValue" class="value" style="min-width:35px;">30%</span>
      </div>

      <div class="sliderBox" style="width:auto; flex-direction:row; align-items:center;">
        <span class="label">FPS:</span>
        <input type="number" id="animFPS" value="12" min="1" max="60">
        <span class="label">Frames:</span>
        <input type="number" id="totalFramesInput" value="24" min="1" max="100">
      </div>
    </div>

    <div class="timelineDivider"></div>

    <div class="timelineTrackContainer">
      <div class="timelineTrack" id="timelineTrack">
        <!-- Células geradas via JS -->
      </div>
    </div>
  </div>

  <div id="bottom">
    <button id="undo">↶ Desfazer</button>
    <button id="redo">↷ Refazer</button>
    <button id="clear">🗑️ Limpar</button>
    <button id="original">↺ Restaurar</button>
    <div class="newDrawingGroup" style="width:auto;">
      <select id="newDrawing" title="Escolher novo desenho" style="width:auto;">
        <option value="">＋ Novo desenho...</option>
        <optgroup label="Formatos comuns">
          <option value="square">Quadrado — 1200 × 1200</option>
          <option value="landscape">Paisagem — 1600 × 1000</option>
          <option value="portrait">Retrato — 1000 × 1400</option>
          <option value="hd">HD 16:9 — 1600 × 900</option>
          <option value="fullhd">Full HD 16:9 — 1920 × 1080</option>
          <option value="4k">4K 16:9 — 3840 × 2160</option>
        </optgroup>
      </select>
    </div>
    <button id="save">💾 Salvar</button>
    <button id="load">📂 Carregar</button>
    <button id="export">⬇️ PNG</button>
    <button id="exportZip">📦 Exportar ZIP</button>

    <div class="spacer" style="display:block; flex:1;"></div>
    <button id="zoomOut">−</button>
    <span id="zoomValue" class="value" style="min-width:42px;">100%</span>
    <button id="zoomIn">＋</button>
    <button id="zoomReset">🔍 100%</button>
  </div>
</div>

<!-- MODAL DE PRÉ-VISUALIZAÇÃO DE LAYOUTS -->
<div id="themePreviewModal">
  <div class="modalContent">
    <h3>Opções Prévias de Layout</h3>
    <p class="label" style="margin-top:4px">Escolha o estilo visual para o seu workspace:</p>
    <div class="themeGrid" id="themeGrid"></div>
    <div style="margin-top:16px; text-align:right">
      <button id="btnCloseModal">Fechar</button>
    </div>
  </div>
</div>

<script>
"use strict";

const canvas = document.getElementById("paintCanvas");
const wrapper = document.getElementById("canvasWrapper");
const ctx = canvas.getContext("2d", {willReadFrequently:true});
const viewport = document.getElementById("canvasViewport");

let tool = "ink";
let drawing = false;
let last = null;
let start = null;
let pointerId = null;
let pointerType = "touch";
let pressureValue = .5;
let zoom = 1;

const MIN_ZOOM = .05, MAX_ZOOM = 4;
let undoStack = [], redoStack = [];
let originalData = null;

const pointers = new Map();
let gestureStart = null;

/* VARIÁVEIS PARA SELEÇÃO / CLIPBOARD E ITEM FLUTUANTE */
let selectionRect = null; // {x, y, w, h}
let lastSelectionCoords = null; // {x, y, w, h}
let clipboardData = null; // ImageData
let isSelecting = false;
let selectionStart = null;
let floatingItem = null; // { canvas: HTMLCanvasElement, x: number, y: number }

/* ESTRUTURA DE ANIMAÇÃO */
let currentFrame = 1;
let totalFrames = 24;
let keyframes = new Map();
let isPlaying = false;
let playInterval = null;

function smoothing(c){
  c.imageSmoothingEnabled = true;
  c.imageSmoothingQuality = "high";
}
smoothing(ctx);

function setCanvasSize(w, h, copy = true){
  w = Math.max(1, Math.floor(w)); h = Math.max(1, Math.floor(h));
  let old = null;
  if(copy && canvas.width && canvas.height){
    old = document.createElement("canvas");
    old.width = canvas.width; old.height = canvas.height;
    old.getContext("2d").drawImage(canvas, 0, 0);
  }
  canvas.width = w; canvas.height = h;
  smoothing(ctx);
  if(old) ctx.drawImage(old, 0, 0);
  originalData = snapshot();
  undoStack = []; redoStack = [];
  fitCanvas();
  updateStatus();
}

function snapshot(){
  return canvas.width && canvas.height ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
}
function pushUndo(){
  const s = snapshot();
  if(!s) return;
  undoStack.push(s);
  if(undoStack.length > 40) undoStack.shift();
  redoStack = [];
}
function restore(s){
  if(!s) return;
  ctx.putImageData(s, 0, 0);
  updateStatus();
}
function undo(){
  if(!undoStack.length) return;
  const cur = snapshot();
  if(cur) redoStack.push(cur);
  restore(undoStack.pop());
}
function redo(){
  if(!redoStack.length) return;
  const cur = snapshot();
  if(cur) undoStack.push(cur);
  restore(redoStack.pop());
}

function showMessage(text){
  const el = document.getElementById("message");
  el.textContent = text; el.style.display = "block";
  clearTimeout(showMessage.timer);
  showMessage.timer = setTimeout(() => el.style.display = "none", 2000);
}

function updateStatus(){
  const names = {
    pencil:"Lápis Cartoon", "pencil-soft":"Grafite macio", "pencil-hard":"Grafite duro",
    "pencil-real":"Lápis sensível", mechanical:"Lapiseira", fineliner:"Caneta técnica",
    ink:"Nanquim", "brush-pen":"Caneta Brush", marker:"Marcador",
    "hard-brush":"Pincel duro", "soft-brush":"Pincel suave",
    watercolor:"Aquarela", chalk:"Giz", eraser:"Borracha", picker:"Conta-gotas", fill:"Balde", select:"Seleção Retangular"
  };
  document.getElementById("status").textContent =
    `${canvas.width} × ${canvas.height}px • ${names[tool]||tool} • ${Math.round(zoom*100)}%`;
}

function setTool(t){
  if(floatingItem) dropFloatingItem();

  // Se trocar de ferramenta e não for "select", esquece o processo de recorte atual
  if(t !== "select") {
    selectionRect = null;
    isSelecting = false;
    selectionStart = null;
  }

  tool = t;
  document.getElementById("brush").value =
    ["eraser", "picker", "fill", "select"].includes(t) ? "ink" : t;
  ["eraser", "picker", "fill", "select"].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.classList.toggle("active", id === t);
  });
  
  if (t === "picker") {
    canvas.style.cursor = "copy";
  } else if (t === "fill") {
    canvas.style.cursor = "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 11l-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11z\"></path><path d=\"M5 2l5 5\"></path><path d=\"M2 22h20\"></path></svg>') 0 24, auto";
  } else if (t === "eraser") {
    canvas.style.cursor = "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21H7z\"></path><path d=\"M22 21H7\"></path><path d=\"m5 11 9 9\"></path></svg>') 0 24, auto";
  } else if (t === "select") {
    canvas.style.cursor = "crosshair";
  } else {
    canvas.style.cursor = "crosshair";
  }
  updateStatus();
}

function color(){ return document.getElementById("color").value || "#ff0055"; }
function size(){ return Math.max(1, Number(document.getElementById("size").value) || 12); }
function pressureFactor(){
  const influence = Number(document.getElementById("pressure").value) / 100;
  return 1 - influence + pressureValue * influence;
}

function settings(){
  const base = size(), f = pressureFactor();
  switch(tool){
    case "pencil-soft": return {size:base*(.38+f), alpha:.14+f*.48, blur:Math.max(.45, base*.075)};
    case "pencil-hard": return {size:base*(.34+f*.78), alpha:.38+f*.56, blur:0};
    case "pencil-real": return {size:base*(.18+f*1.10), alpha:.08+f*.86, blur:Math.max(0, base*.018)};
    case "mechanical": return {size:base*(.22+f*.55), alpha:.72+f*.28, blur:0};
    case "fineliner": return {size:base*(.28+f*.34), alpha:.82+f*.18, blur:0};
    case "ink": return {size:base*(.18+f*1.02), alpha:.78+f*.22, blur:0};
    case "brush-pen": return {size:base*(.20+f*1.45), alpha:.62+f*.38, blur:0};
    case "marker": return {size:base*(.72+f*.70), alpha:.20+f*.34, blur:.2};
    case "hard-brush": return {size:base*(.40+f), alpha:.72+f*.28, blur:0};
    case "soft-brush": return {size:base*(.65+f*.90), alpha:.10+f*.48, blur:Math.max(1, base*.16)};
    case "watercolor": return {size:base*(.75+f*.85), alpha:.06+f*.24, blur:Math.max(.7, base*.10)};
    case "chalk": return {size:base*(.55+f*.95), alpha:.22+f*.42, blur:.35};
    default: return {size:base*(.28+f*.92), alpha:.30+f*.62, blur:Math.max(0, base*.012)};
  }
}

function drawSegment(a, b){
  const s = tool === "eraser" ? {size:size(), alpha:1, blur:0} : settings();
  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = s.size;
  if(tool === "eraser"){
    ctx.globalCompositeOperation = "destination-out";
    ctx.strokeStyle = "rgba(0,0,0,1)";
  }else{
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = color();
    ctx.globalAlpha = s.alpha;
    if(s.blur > 0) ctx.filter = `blur(${s.blur}px)`;
  }
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.restore();
}

function point(e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}
function updatePressure(e){
  pressureValue = Number.isFinite(e.pressure) && e.pressure > 0 ? e.pressure : .5;
  pointerType = e.pointerType || "mouse";
}

function hexRGBA(hex){
  const h = String(hex).replace("#", "");
  const v = h.length === 3 ? h.split("").map(x => x + x).join("") : h.padEnd(6, "0").slice(0, 6);
  return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16), 255];
}

function floodFill(sx, sy){
  const w = canvas.width, h = canvas.height;
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  const start = (sy * w + sx) * 4;
  const sr = d[start], sg = d[start+1], sb = d[start+2], sa = d[start+3];
  const [tr, tg, tb, ta] = hexRGBA(color());
  const tolerance = 18 * 2.55;

  const matches = i => {
    const dr = d[i] - sr, dg = d[i+1] - sg, db = d[i+2] - sb, da = d[i+3] - sa;
    return Math.sqrt((dr*dr + dg*dg + db*db + da*da) / 4) <= tolerance;
  };
  if(sr === tr && sg === tg && sb === tb && sa === ta) return;

  const visited = new Uint8Array(w * h);
  const stack = [sx + sy * w];
  visited[sx + sy * w] = 1;

  while(stack.length){
    const pos = stack.pop(), x = pos % w, y = Math.floor(pos / w), i = pos * 4;
    if(!matches(i)) continue;
    d[i] = tr; d[i+1] = tg; d[i+2] = tb; d[i+3] = ta;
    if(x > 0){ let n = pos - 1; if(!visited[n]){ visited[n] = 1; stack.push(n); } }
    if(x < w - 1){ let n = pos + 1; if(!visited[n]){ visited[n] = 1; stack.push(n); } }
    if(y > 0){ let n = pos - w; if(!visited[n]){ visited[n] = 1; stack.push(n); } }
    if(y < h - 1){ let n = pos + w; if(!visited[n]){ visited[n] = 1; stack.push(n); } }
  }
  ctx.putImageData(img, 0, 0);
}

/* SISTEMA DE ITEM FLUTUANTE E RENDERIZAÇÃO COM SELEÇÃO PONTILHADA */

function redrawCanvasWithFloating(){
  renderFrameBaseOnly();
  if(floatingItem){
    ctx.drawImage(floatingItem.canvas, floatingItem.x, floatingItem.y);
  }
  if(selectionRect && selectionRect.w > 0 && selectionRect.h > 0){
    ctx.save();
    ctx.strokeStyle = "#00d2ff";
    ctx.lineWidth = 2 / zoom;
    ctx.setLineDash([6 / zoom, 6 / zoom]);
    ctx.strokeRect(selectionRect.x, selectionRect.y, selectionRect.w, selectionRect.h);
    ctx.fillStyle = "rgba(0, 210, 255, 0.1)";
    ctx.fillRect(selectionRect.x, selectionRect.y, selectionRect.w, selectionRect.h);
    ctx.restore();
  }
}

function renderFrameBaseOnly(){
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const useOnion = document.getElementById("chkOnion").checked;
  if(useOnion){
    const prevCount = Math.max(0, parseInt(document.getElementById("onionPrev").value) || 0);
    const nextCount = Math.max(0, parseInt(document.getElementById("onionNext").value) || 0);
    const baseOpacity = (parseInt(document.getElementById("onionOpacity").value) || 30) / 100;

    for(let i = prevCount; i >= 1; i--){
      const f = currentFrame - i;
      if(keyframes.has(f)){
        drawOnionLayer(keyframes.get(f), baseOpacity / i);
      }
    }

    for(let i = 1; i <= nextCount; i++){
      const f = currentFrame + i;
      if(keyframes.has(f)){
        drawOnionLayer(keyframes.get(f), baseOpacity / i);
      }
    }
  }

  // O frame atual só exibe seu próprio desenho se possuir keyframe. Caso contrário, fica em branco.
  if(keyframes.has(currentFrame)){
    drawOnionLayer(keyframes.get(currentFrame), 1.0);
  }
}

function dropFloatingItem(){
  if(!floatingItem) return;
  pushUndo();
  ctx.drawImage(floatingItem.canvas, floatingItem.x, floatingItem.y);
  floatingItem = null;
  autoSaveKeyframe();
  updateStatus();
  showMessage("Item fixado no canvas!");
}

function startFloatingFromImageData(imgData, targetX, targetY) {
  if(floatingItem) dropFloatingItem();
  pushUndo();

  const tempCvs = document.createElement("canvas");
  tempCvs.width = imgData.width;
  tempCvs.height = imgData.height;
  tempCvs.getContext("2d").putImageData(imgData, 0, 0);

  floatingItem = {
    canvas: tempCvs,
    x: Math.floor(targetX),
    y: Math.floor(targetY)
  };
  redrawCanvasWithFloating();
  showMessage("Arraste para posicionar e clique fora para fixar!");
}

/* FUNÇÕES DE COPIAR E COLAR A SELEÇÃO */
function copySelectionArea() {
  if(floatingItem) dropFloatingItem();

  if(!selectionRect || selectionRect.w === 0 || selectionRect.h === 0) {
    showMessage("Nenhuma área selecionada!");
    return;
  }
  const x = Math.max(0, Math.floor(selectionRect.x));
  const y = Math.max(0, Math.floor(selectionRect.y));
  const w = Math.min(canvas.width - x, Math.floor(selectionRect.w));
  const h = Math.min(canvas.height - y, Math.floor(selectionRect.h));

  if(w > 0 && h > 0) {
    clipboardData = ctx.getImageData(x, y, w, h);
    lastSelectionCoords = {x, y, w, h};
    selectionRect = null; // Retira o retângulo informando área de recorte
    redrawCanvasWithFloating();
    updateStatus();
    showMessage("Área copiada para a memória!");
  }
}

function pasteSelectionArea() {
  if(floatingItem) dropFloatingItem();
  if(!clipboardData) {
    showMessage("Área de transferência vazia!");
    return;
  }
  // Cola na mesma área do recorte original
  const px = lastSelectionCoords ? lastSelectionCoords.x : Math.floor((canvas.width - clipboardData.width) / 2);
  const py = lastSelectionCoords ? lastSelectionCoords.y : Math.floor((canvas.height - clipboardData.height) / 2);
  startFloatingFromImageData(clipboardData, px, py);
}

function pointerDown(e){
  if(isPlaying) return;
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if(pointers.size > 1){
    drawing = false; isSelecting = false;
    startGesture();
    return;
  }
  if(e.pointerType === "mouse" && e.button !== 0) return;
  e.preventDefault();
  updatePressure(e);
  const p = point(e);
  const x = Math.max(0, Math.min(canvas.width - 1, Math.floor(p.x)));
  const y = Math.max(0, Math.min(canvas.height - 1, Math.floor(p.y)));

  if(floatingItem){
    const fx = floatingItem.x;
    const fy = floatingItem.y;
    const fw = floatingItem.canvas.width;
    const fh = floatingItem.canvas.height;

    if(p.x >= fx && p.x <= fx + fw && p.y >= fy && p.y <= fy + fh){
      drawing = true;
      last = p;
      pointerId = e.pointerId;
      canvas.setPointerCapture?.(e.pointerId);
      return;
    } else {
      dropFloatingItem();
    }
  }

  if(tool === "picker"){
    const px = ctx.getImageData(x, y, 1, 1).data;
    if(px[3] > 0){
      document.getElementById("color").value = "#" + [px[0], px[1], px[2]]
        .map(v => v.toString(16).padStart(2, "0")).join("");
      setTool("pencil");
    }
    return;
  }
  if(tool === "fill"){
    pushUndo(); floodFill(x, y); autoSaveKeyframe(); updateStatus(); return;
  }
  if(tool === "select"){
    isSelecting = true;
    selectionStart = p;
    selectionRect = {x: p.x, y: p.y, w: 0, h: 0};
    return;
  }

  pushUndo();
  drawing = true; last = p; start = p; pointerId = e.pointerId;
  canvas.setPointerCapture?.(e.pointerId);
}

function pointerMove(e){
  if(pointers.has(e.pointerId))
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});

  if(pointers.size > 1){
    if(!gestureStart) startGesture();
    updateGesture();
    return;
  }

  const p = point(e);

  if(floatingItem && drawing && pointerId === e.pointerId){
    e.preventDefault();
    const dx = p.x - last.x;
    const dy = p.y - last.y;
    floatingItem.x += dx;
    floatingItem.y += dy;
    last = p;
    redrawCanvasWithFloating();
    return;
  }

  if(isSelecting && selectionStart){
    e.preventDefault();
    selectionRect = {
      x: Math.min(selectionStart.x, p.x),
      y: Math.min(selectionStart.y, p.y),
      w: Math.abs(p.x - selectionStart.x),
      h: Math.abs(p.y - selectionStart.y)
    };
    redrawCanvasWithFloating();
    return;
  }
  if(!drawing) return;
  e.preventDefault();
  updatePressure(e);
  if(e.shiftKey && start){
    const base = undoStack[undoStack.length - 1];
    if(base) ctx.putImageData(base, 0, 0);
    drawSegment(start, p);
  }else if(last){
    drawSegment(last, p);
  }
  last = p;
}

function pointerUp(e){
  pointers.delete(e.pointerId);
  if(pointers.size === 0){
    if(isSelecting){
      isSelecting = false;
      showMessage("Área delimitada com sucesso!");
    }
    if(drawing){
      drawing = false;
      if(!floatingItem) autoSaveKeyframe();
    }
    last = null; start = null; pointerId = null;
    try{ canvas.releasePointerCapture?.(e.pointerId); }catch(_){}
  }else if(pointers.size === 1){
    gestureStart = null;
  }
}

canvas.addEventListener("pointerdown", pointerDown);
canvas.addEventListener("pointermove", pointerMove);
canvas.addEventListener("pointerup", pointerUp);
canvas.addEventListener("pointercancel", pointerUp);

function distance(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function midpoint(a, b){ return {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2}; }

function startGesture(){
  const ps = [...pointers.values()];
  if(ps.length < 2) return;
  const a = ps[0], b = ps[1], m = midpoint(a, b);
  gestureStart = {dist: distance(a, b), mid: m, zoom, tx: currentTX, ty: currentTY};
}

function updateGesture(){
  const ps = [...pointers.values()];
  if(ps.length < 2 || !gestureStart) return;
  const a = ps[0], b = ps[1];
  const dist = distance(a, b);
  if(gestureStart.dist > 0){
    const factor = dist / gestureStart.dist;
    setZoom(gestureStart.zoom * factor);
  }
}

let currentTX = 0, currentTY = 0;

function updateViewportSize(){
  const workspace = viewport.parentElement;
  const w = workspace.clientWidth;
  const h = workspace.clientHeight;
  const wrapperHeight = canvas.height + 48;
  const scaledW = Math.max(1, canvas.width * zoom);
  const scaledH = Math.max(1, wrapperHeight * zoom);

  const marginX = Math.max(40, (w - scaledW) / 2);
  const marginY = Math.max(40, (h - scaledH) / 2);

  viewport.style.width = Math.max(w, scaledW + marginX * 2) + "px";
  viewport.style.height = Math.max(h, scaledH + marginY * 2) + "px";

  return {w, h, scaledW, scaledH};
}

function updateTransform(){
  const metrics = updateViewportSize();
  if(metrics.scaledW <= metrics.w){ currentTX = (metrics.w - metrics.scaledW) / 2; }
  if(metrics.scaledH <= metrics.h){ currentTY = (metrics.h - metrics.scaledH) / 2; }

  wrapper.style.transform = `translate(${currentTX}px,${currentTY}px) scale(${zoom})`;
  document.getElementById("zoomValue").textContent = Math.round(zoom * 100) + "%";
  updateStatus();
}

function setZoom(newZoom){
  zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
  updateTransform();
}

function fitCanvas(){
  const workspace = viewport.parentElement;
  const w = workspace.clientWidth;
  const h = workspace.clientHeight;
  const wrapperHeight = canvas.height + 48;

  const zx = (w * .88) / Math.max(1, canvas.width);
  const zy = (h * .82) / Math.max(1, wrapperHeight);

  zoom = Math.max(MIN_ZOOM, Math.min(1, Math.min(zx, zy)));
  currentTX = 0; currentTY = 0;
  updateTransform();

  workspace.scrollLeft = 0;
  workspace.scrollTop = 0;
}

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
}, {passive: false});

function getLatestKeyframeBefore(frameNum){
  let lastFrame = 0;
  for(let [f] of keyframes){
    if(f < frameNum && f > lastFrame){
      lastFrame = f;
    }
  }
  return lastFrame > 0 ? keyframes.get(lastFrame) : null;
}

function renderTimeline(){
  const track = document.getElementById("timelineTrack");
  track.innerHTML = "";

  const useOnion = document.getElementById("chkOnion").checked;
  const prevCount = useOnion ? Math.max(0, parseInt(document.getElementById("onionPrev").value) || 0) : 0;
  const nextCount = useOnion ? Math.max(0, parseInt(document.getElementById("onionNext").value) || 0) : 0;

  for(let i = 1; i <= totalFrames; i++){
    const cell = document.createElement("div");
    let classes = ["frameCell"];

    if (i === currentFrame) {
      classes.push("active");
    } else if (useOnion && i >= currentFrame - prevCount && i < currentFrame) {
      classes.push("onion-prev");
    } else if (useOnion && i > currentFrame && i <= currentFrame + nextCount) {
      classes.push("onion-next");
    }

    if (keyframes.has(i)) classes.push("hasKeyframe");

    cell.className = classes.join(" ");
    cell.dataset.frame = i;
    
    const num = document.createElement("span");
    num.textContent = i;
    cell.appendChild(num);

    track.appendChild(cell);
  }
}

function autoSaveKeyframe(){
  if(keyframes.has(currentFrame)){
    keyframes.set(currentFrame, snapshot());
    renderTimeline();
  }
}

function setKeyframe(){
  if(floatingItem) dropFloatingItem();
  if(!keyframes.has(currentFrame)){
    const prevData = getLatestKeyframeBefore(currentFrame);
    if(prevData){
      ctx.putImageData(prevData, 0, 0);
    } else {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }
  keyframes.set(currentFrame, snapshot());
  renderTimeline();
  showMessage(`Keyframe salvo no quadro ${currentFrame}`);
}

function removeKeyframe(){
  if(floatingItem) dropFloatingItem();
  if(keyframes.has(currentFrame)){
    keyframes.delete(currentFrame);
    renderTimeline();
    renderFrame();
    showMessage(`Keyframe removido do quadro ${currentFrame}`);
  }
}

function renderFrame(){
  if(floatingItem) dropFloatingItem();
  renderFrameBaseOnly();
  undoStack = []; redoStack = [];
}

function drawOnionLayer(imgData, alpha){
  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
  const tCtx = tempCanvas.getContext("2d");
  tCtx.putImageData(imgData, 0, 0);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(tempCanvas, 0, 0);
  ctx.restore();
}

function gotoFrame(f){
  if(floatingItem) dropFloatingItem();
  if(f < 1) f = totalFrames;
  if(f > totalFrames) f = 1;
  currentFrame = f;
  renderTimeline();
  renderFrame();
}

function togglePlay(){
  if(floatingItem) dropFloatingItem();
  isPlaying = !isPlaying;
  const btn = document.getElementById("btnPlay");
  if(isPlaying){
    btn.textContent = "⏸️ Pausar";
    const fps = Math.max(1, parseInt(document.getElementById("animFPS").value) || 12);
    playInterval = setInterval(() => {
      gotoFrame(currentFrame + 1);
    }, 1000 / fps);
  } else {
    btn.textContent = "▶️ Tocar";
    clearInterval(playInterval);
    renderFrame();
  }
}

const track = document.getElementById("timelineTrack");
let isScrubbing = false;

function updateFrameFromPointer(e){
  const element = document.elementFromPoint(e.clientX, e.clientY);
  const cell = element ? element.closest('.frameCell') : null;
  if(cell && cell.dataset.frame){
    const f = parseInt(cell.dataset.frame);
    if(f !== currentFrame){
      gotoFrame(f);
    }
  }
}

track.addEventListener('pointerdown', (e) => {
  isScrubbing = true;
  track.setPointerCapture(e.pointerId);
  updateFrameFromPointer(e);
});

track.addEventListener('pointermove', (e) => {
  if(isScrubbing){
    updateFrameFromPointer(e);
  }
});

track.addEventListener('pointerup', (e) => {
  if(isScrubbing){
    isScrubbing = false;
    try{ track.releasePointerCapture(e.pointerId); }catch(_){}
  }
});

track.addEventListener('pointercancel', (e) => {
  isScrubbing = false;
});

async function exportAnimationToZip(){
  if(floatingItem) dropFloatingItem();
  if(typeof JSZip === "undefined"){
    showMessage("Carregando biblioteca ZIP...");
    return;
  }
  
  showMessage("Gerando arquivo ZIP...");
  const zip = new JSZip();
  const folder = zip.folder("animacao_frames");

  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = canvas.width;
  tempCanvas.height = canvas.height;
  const tempCtx = tempCanvas.getContext("2d");

  for(let frameNum = 1; frameNum <= totalFrames; frameNum++){
    let frameData = keyframes.get(frameNum);
    if(!frameData){
      frameData = getLatestKeyframeBefore(frameNum);
    }

    tempCtx.fillStyle = "#ffffff";
    tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

    if(frameData){
      tempCtx.putImageData(frameData, 0, 0);
    }

    const dataUrl = tempCanvas.toDataURL("image/png");
    const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
    
    const fileName = `frame_${String(frameNum).padStart(3, '0')}.png`;
    folder.file(fileName, base64Data, {base64: true});
  }

  const content = await zip.generateAsync({type:"blob"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(content);
  a.download = "sequencia_animacao.zip";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showMessage("ZIP gerado com sucesso!");
}

const themeData = [
  { id: "dark", name: "Dark Classic", bg: "#171923", panel: "#232634", accent: "#00d2ff" },
  { id: "light", name: "Light Clean", bg: "#e2e8f0", panel: "#ffffff", accent: "#2563eb" },
  { id: "cyberpunk", name: "Cyberpunk Neon", bg: "#0d0221", panel: "#0f051d", accent: "#ff007f" },
  { id: "nordic", name: "Nordic Slate", bg: "#2e3440", panel: "#3b4252", accent: "#88c0d0" },
  { id: "forest", name: "Forest Organic", bg: "#1a231d", panel: "#243028", accent: "#52b788" },
  { id: "sunset", name: "Sunset Pastel", bg: "#2b1e2a", panel: "#3a2838", accent: "#ff7b54" },
  { id: "dracula", name: "Dracula Gothic", bg: "#282a36", panel: "#44475a", accent: "#bd93f9" },
  { id: "solarized", name: "Solarized Light", bg: "#fdf6e3", panel: "#eee8d5", accent: "#b58900" },
  { id: "neongreen", name: "Cyber Neon Green", bg: "#051408", panel: "#0b2910", accent: "#00ff38" },
  { id: "monochrome", name: "Monochrome Ink", bg: "#121212", panel: "#1e1e1e", accent: "#ffffff" },
  { id: "pastel", name: "Pastel Dream", bg: "#fbf0f5", panel: "#f3d7e5", accent: "#d9658b" },
  { id: "midnight", name: "Midnight Blue", bg: "#0f172a", panel: "#1e293b", accent: "#38bdf8" }
];

function applyTheme(themeId) {
  document.documentElement.setAttribute("data-theme", themeId);
  document.getElementById("themeSelect").value = themeId;
  localStorage.setItem("miniPaintTabletTheme", themeId);
}

function initThemeSystem() {
  const savedTheme = localStorage.getItem("miniPaintTabletTheme") || "dark";
  applyTheme(savedTheme);

  document.getElementById("themeSelect").addEventListener("change", (e) => {
    applyTheme(e.target.value);
  });

  const grid = document.getElementById("themeGrid");
  grid.innerHTML = "";
  themeData.forEach(t => {
    const card = document.createElement("div");
    card.className = "themeCard";
    card.onclick = () => {
      applyTheme(t.id);
      document.getElementById("themePreviewModal").style.display = "none";
    };
    
    card.innerHTML = `
      <div class="themePreviewBox">
        <div class="themeColorSample" style="background:${t.bg}"></div>
        <div class="themeColorSample" style="background:${t.panel}"></div>
        <div class="themeColorSample" style="background:${t.accent}"></div>
      </div>
      <div style="font-size:0.85rem; font-weight:bold">${t.name}</div>
    `;
    grid.appendChild(card);
  });

  document.getElementById("btnPreviewThemes").onclick = () => {
    document.getElementById("themePreviewModal").style.display = "flex";
  };
  document.getElementById("btnCloseModal").onclick = () => {
    document.getElementById("themePreviewModal").style.display = "none";
  };
}

const topbar = document.getElementById("topbar");
const topbarHeader = document.getElementById("topbarHeader");
const btnMinimize = document.getElementById("btnMinimize");

let isDraggingMenu = false;
let menuStartX = 0, menuStartY = 0;
let menuPosX = 15, menuPosY = 15;

topbarHeader.addEventListener("pointerdown", (e) => {
  if (e.target.closest('#btnMinimize')) return;
  isDraggingMenu = true;
  menuStartX = e.clientX - topbar.offsetLeft;
  menuStartY = e.clientY - topbar.offsetTop;
  topbarHeader.setPointerCapture(e.pointerId);
});

topbarHeader.addEventListener("pointermove", (e) => {
  if (!isDraggingMenu) return;
  menuPosX = e.clientX - menuStartX;
  menuPosY = e.clientY - menuStartY;
  
  const maxW = window.innerWidth - topbar.offsetWidth;
  const maxH = window.innerHeight - topbar.offsetHeight;
  menuPosX = Math.max(0, Math.min(menuPosX, maxW));
  menuPosY = Math.max(0, Math.min(menuPosY, maxH));

  topbar.style.left = menuPosX + "px";
  topbar.style.top = menuPosY + "px";
});

topbarHeader.addEventListener("pointerup", (e) => {
  isDraggingMenu = false;
  try { topbarHeader.releasePointerCapture(e.pointerId); } catch(_) {}
});

btnMinimize.onclick = () => {
  topbar.classList.toggle("minimized");
  btnMinimize.textContent = topbar.classList.contains("minimized") ? "🗖" : "🗕";
};

document.getElementById("btnPlay").onclick = togglePlay;
document.getElementById("btnPrevFrame").onclick = () => gotoFrame(currentFrame - 1);
document.getElementById("btnNextFrame").onclick = () => gotoFrame(currentFrame + 1);
document.getElementById("btnAddKeyframe").onclick = setKeyframe;
document.getElementById("btnRemoveKeyframe").onclick = removeKeyframe;

document.getElementById("chkOnion").onchange = () => { renderFrame(); renderTimeline(); };
document.getElementById("onionPrev").onchange = () => { renderFrame(); renderTimeline(); };
document.getElementById("onionNext").onchange = () => { renderFrame(); renderTimeline(); };

document.getElementById("onionOpacity").oninput = (e) => {
  document.getElementById("onionOpacityValue").textContent = e.target.value + "%";
  renderFrame();
};

document.getElementById("totalFramesInput").onchange = (e) => {
  totalFrames = Math.max(1, parseInt(e.target.value) || 1);
  if(currentFrame > totalFrames) currentFrame = totalFrames;
  renderTimeline();
};

document.getElementById("brush").onchange = e => setTool(e.target.value);
document.getElementById("eraser").onclick = () => setTool("eraser");
document.getElementById("picker").onclick = () => setTool("picker");
document.getElementById("fill").onclick = () => setTool("fill");
document.getElementById("select").onclick = () => setTool("select");

document.getElementById("copySelection").onclick = copySelectionArea;
document.getElementById("pasteSelection").onclick = pasteSelectionArea;

document.getElementById("size").oninput = e => {
  document.getElementById("sizeValue").textContent = e.target.value + " px";
};
document.getElementById("pressure").oninput = e => {
  document.getElementById("pressureValue").textContent = e.target.value + "%";
};

document.getElementById("undo").onclick = () => { if(floatingItem) dropFloatingItem(); undo(); };
document.getElementById("redo").onclick = () => { if(floatingItem) dropFloatingItem(); redo(); };
document.getElementById("clear").onclick = () => {
  if(floatingItem) dropFloatingItem();
  pushUndo(); ctx.clearRect(0, 0, canvas.width, canvas.height); autoSaveKeyframe(); updateStatus();
};
document.getElementById("original").onclick = () => {
  if(floatingItem) dropFloatingItem();
  if(!originalData) return; pushUndo(); restore(originalData); autoSaveKeyframe();
};

document.getElementById("zoomOut").onclick = () => setZoom(zoom / 1.25);
document.getElementById("zoomIn").onclick = () => setZoom(zoom * 1.25);
document.getElementById("zoomReset").onclick = () => setZoom(1);

document.getElementById("newDrawing").onchange = e => {
  if(floatingItem) dropFloatingItem();
  const type = e.target.value;
  if(!type) return;

  let w = 1600, h = 1000;
  if(type === "square"){ w = 1200; h = 1200; }
  else if(type === "landscape"){ w = 1600; h = 1000; }
  else if(type === "portrait"){ w = 1000; h = 1400; }
  else if(type === "hd"){ w = 1600; h = 900; }
  else if(type === "fullhd"){ w = 1920; h = 1080; }
  else if(type === "4k"){ w = 3840; h = 2160; }

  keyframes.clear();
  setCanvasSize(w, h, false);
  ctx.save();
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);
  ctx.restore();

  originalData = snapshot();
  autoSaveKeyframe();

  setTool("ink");
  document.getElementById("color").value = "#0066ff";
  document.getElementById("size").value = 12;
  document.getElementById("sizeValue").textContent = "12 px";

  fitCanvas();
  e.target.value = "";
  showMessage("Novo documento criado");
};

document.getElementById("save").onclick = () => {
  if(floatingItem) dropFloatingItem();
  localStorage.setItem("miniPaintTablet", JSON.stringify({
    width: canvas.width, height: canvas.height, data: canvas.toDataURL("image/png")
  }));
  showMessage("Desenho salvo no tablet");
};

document.getElementById("load").onclick = () => {
  if(floatingItem) dropFloatingItem();
  const raw = localStorage.getItem("miniPaintTablet");
  if(!raw){ showMessage("Nenhum desenho salvo"); return; }
  const obj = JSON.parse(raw), img = new Image();
  img.onload = () => {
    keyframes.clear();
    setCanvasSize(obj.width, obj.height, false);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0); 
    originalData = snapshot(); 
    autoSaveKeyframe();
    fitCanvas();
    showMessage("Desenho carregado");
  };
  img.src = obj.data;
};

document.getElementById("export").onclick = () => {
  if(floatingItem) dropFloatingItem();
  canvas.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "animacao-frame.png"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
};

document.getElementById("exportZip").onclick = exportAnimationToZip;

window.addEventListener("keydown", e => {
  if(e.ctrlKey && e.key.toLowerCase() === "z"){ e.preventDefault(); if(floatingItem) dropFloatingItem(); undo(); }
  else if(e.ctrlKey && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))){ e.preventDefault(); if(floatingItem) dropFloatingItem(); redo(); }
  else if(e.ctrlKey && e.key.toLowerCase() === "c"){ e.preventDefault(); copySelectionArea(); }
  else if(e.ctrlKey && e.key.toLowerCase() === "v"){ e.preventDefault(); pasteSelectionArea(); }
  else if(e.key === "e" || e.key === "E") setTool("eraser");
});

window.addEventListener("resize", () => {
  if(pointers.size === 0) fitCanvas();
  else updateTransform();
});

initThemeSystem();
setCanvasSize(1600, 1000, false);
ctx.fillStyle = "#ffffff";
ctx.fillRect(0, 0, canvas.width, canvas.height);
document.getElementById("color").value = "#0066ff";
document.getElementById("size").value = 12;
document.getElementById("sizeValue").textContent = "12 px";
setTool("ink");
originalData = snapshot();
autoSaveKeyframe();
renderTimeline();
fitCanvas();
</script>
